<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Terminal permissions</title>
<style>
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; padding: 16px; color: #1a1a1a; }
  h3 { margin: 0 0 4px; font-size: 15px; }
  p.lede { margin: 0 0 16px; color: #595959; }
  .req { border: 1px solid #e7e7e7; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .req dl { margin: 0 0 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .req dt { color: #595959; }
  .req dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #b0b0b0;
           background: #fff; cursor: pointer; }
  button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  button + button { margin-left: 8px; }
  .allowed { margin-top: 20px; border-top: 1px solid #e7e7e7; padding-top: 12px; }
  .allowed li { display: flex; align-items: center; justify-content: space-between;
                gap: 12px; padding: 4px 0; }
  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .empty { color: #888; }
</style>
</head>
<body>
  <h3>Terminal permissions</h3>
  <p class="lede">
    A terminal on this board wants to go live, which lets the board page send keystrokes to a
    shell on this machine. The relay cannot tell one frame on a board from another, so this asks
    you instead.
  </p>

  <div id="pending"></div>
  <div class="allowed">
    <strong>Allowed this browser session</strong>
    <ul id="allowed"></ul>
  </div>

<script>
(function () {
  // Same origin as the relay's headless iframe, so a channel reaches it. The
  // relay owns the state; this page only renders it and sends decisions back.
  var bc = new BroadcastChannel('mt-relay-approval');
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  function render(state) {
    var p = document.getElementById('pending');
    var pend = state.pending || [];
    if (!pend.length) {
      p.innerHTML = '<p class="empty">Nothing waiting. You can close this panel.</p>';
    } else {
      p.innerHTML = pend.map(function (r) {
        return '<div class="req"><dl>' +
          '<dt>Session</dt><dd>' + esc(r.sid) + '</dd>' +
          '<dt>Embed</dt><dd>' + esc(r.embedId || 'unnamed') + '</dd>' +
          '<dt>Asked by</dt><dd>' + esc(r.origin) + '</dd>' +
          '</dl>' +
          '<button class="primary" data-allow="' + esc(r.sid) + '">Allow</button>' +
          '<button data-deny="' + esc(r.sid) + '">Deny</button></div>';
      }).join('');
      if (pend.length > 1) {
        p.insertAdjacentHTML('beforeend',
          '<button class="primary" id="allow-all">Allow all ' + pend.length + '</button>');
      }
    }

    var a = document.getElementById('allowed');
    var app = state.approved || [];
    a.innerHTML = app.length
      ? app.map(function (sid) {
          return '<li><code>' + esc(sid) + '</code>' +
                 '<button data-revoke="' + esc(sid) + '">Revoke</button></li>';
        }).join('')
      : '<li class="empty">None</li>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'BUTTON') return;
    if (t.id === 'allow-all') { bc.postMessage({ type: 'allow-all' }); return; }
    if (t.dataset.allow)  bc.postMessage({ type: 'decide', sid: t.dataset.allow, allow: true });
    if (t.dataset.deny)   bc.postMessage({ type: 'decide', sid: t.dataset.deny, allow: false });
    if (t.dataset.revoke) bc.postMessage({ type: 'revoke', sid: t.dataset.revoke });
  });

  bc.onmessage = function (e) {
    if (e.data && e.data.type === 'state') render(e.data);
  };
  bc.postMessage({ type: 'list' });
  render({ pending: [], approved: [] });
})();
</script>
</body>
</html>
