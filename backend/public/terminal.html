<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <!-- Relative on purpose: this file is served both by the terminal server
       (as the modal) and from public hosting (as a board embed), and
       styles.css is published alongside it in both places. -->
  <link rel="stylesheet" href="./styles.css">
  <!-- Deliberately does NOT load the Miro Web SDK. This page is served by the
       terminal server, so it is on a different origin from the app; the SDK
       loads there but never completes its connection handshake ("SDK is not
       connected / version fetching timeout"), so every board call throws. All
       board work is delegated to the app's headless iframe over postMessage
       instead — see "Talking to the board" below. -->
</head>
<body>
  <div id="status-bar">
    <span id="status-indicator" class="disconnected"></span>
    <span id="status-text">Disconnected</span>
    <!-- Read-only. The one thing the settings panel offered that was worth
         having was telling you which session and board you were looking at;
         that is a line, not a modal. -->
    <span id="identity" title="This terminal's session and board"></span>
  </div>
  <div id="terminal-container"></div>
  
  <script type="module">
    import { Terminal } from 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm';
    import { FitAddon } from 'https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/+esm';

    // Tell the parent (terminal-wrapper, if that's what loaded this in an
    // iframe) that this page is genuinely serving from a real backend — not
    // a connection-refused/TLS-interstitial page, which never runs this
    // script at all. Fired immediately, not after the WS connects: the
    // wrapper only needs to know "a real backend is here," and its own
    // timeout is the fallback if this never arrives. Harmless if there's no
    // parent listening (e.g. terminal.html opened directly).
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'miro-terminal:ready' }, '*');
    }

    // Parse query parameters
    const params = new URLSearchParams(window.location.search);

    /** Loopback means "served by this machine's own terminal server".
     *
     * That is a stronger statement than it looks, and two decisions below rest
     * on it. A board embed can never be on a loopback origin: a public board
     * page is forbidden from loading one, which is the constraint this whole
     * app is shaped around. So a page that IS on loopback was opened locally,
     * and its URL is not board content — nobody with board edit access could
     * have put it there. */
    function isLoopbackOrigin(origin) {
      try {
        const h = new URL(origin).hostname;
        return h === 'localhost' || h === '127.0.0.1' || h === '[::1]'
               || h === '::1' || /\.localhost$/.test(h);
      } catch (e) { return false; }
    }
    const SERVED_LOCALLY = isLoopbackOrigin(window.location.origin);

    const sid = params.get('sid');
    const token = params.get('token');
    const cwd = params.get('cwd');
    const name = params.get('name');

    // Prevent zoom (Ctrl/Cmd + scroll) inside iframe from affecting parent Miro board.
    // Scrolling without modifier continues to work for the terminal.
    document.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) e.preventDefault();
    }, { passive: false });
    
    // Board info for variable expansion (passed from Miro app)
    const defaultBoardId = params.get('boardId') || '';
    const defaultBoardName = params.get('boardName') || '';
    
    // Unique embed ID from URL (shared when embed is copied)
    const embedId = params.get('embedId') || '';

    // -------------------------------------------------------------------------
    // Which pipe carries the PTY, and therefore where this page is running.
    //
    //   ws     — served BY the terminal server, so same-origin with it: a direct
    //            websocket, and /api/* calls work. This is the modal.
    //   relay  — served publicly, as a board embed. It cannot open a socket to
    //            localhost, nor call /api/* at all, so the envelopes travel by
    //            postMessage to a relay running on the developer's machine.
    //
    // Set by whoever opens the page; defaults to ws, so anything that does not
    // ask for relay behaves exactly as before. Note that in relay mode this page
    // never sees a PTY token — the relay mints one, on the machine that owns the
    // session, and a token has no business on a public page.
    // -------------------------------------------------------------------------
    const TRANSPORT_MODE = params.get('transport') === 'relay' ? 'relay' : 'ws';
    const sameOriginApi = TRANSPORT_MODE === 'ws';
    console.log('[terminal] transport mode:', TRANSPORT_MODE, '· origin:', location.origin);

    // Debug: last context fetch result (for console inspection)
    let lastContextFetch = { at: null, input: '', named: {} };

    // Base session ID (from URL, typically the board ID)
    const baseSid = sid || defaultBoardId || 'default';
    const baseKey = embedId || baseSid;
    
    /**
     * Everything this terminal knows about itself comes from its URL, which the
     * spawner built and the board now stores. There is no local settings state
     * and nothing to persist.
     *
     * A settings panel used to live here — session name, working directory,
     * board URL, board name — backed by per-session localStorage and
     * window.name. It predates the spawner and the relay, and by the end every
     * field was either owned elsewhere or actively misleading: the board fields
     * could only make correct values wrong, and a working directory cannot move
     * a running shell.
     *
     * Renaming a session was worse than useless. It computed a DIFFERENT
     * session id (baseSid + "-" + name) and reconnected to that, while the
     * board widget kept the original — so the change reverted on the next
     * reload, and in the meantime the spawner, the terminal, the relay and the
     * bridge were each looking at a different session. A named terminal created
     * one session in the spawner and then quietly connected to a second.
     *
     * So the session id is now exactly what the board says it is, and a name is
     * only a label.
     */
    const currentSettings = {
      sessionName: params.get('name') || '',
      cwd: params.get('cwd') || '',
      boardId: defaultBoardId,
      boardName: defaultBoardName,
      boardUrl: defaultBoardId ? `https://miro.com/app/board/${defaultBoardId}/` : '',
    };

    const currentEffectiveSid = baseSid;

    // Status elements
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');

    function setStatus(status, text) {
      statusIndicator.className = status;
      statusText.textContent = text;
    }

    (function showIdentity() {
      const el = document.getElementById('identity');
      if (!el) return;
      const bits = [];
      if (currentSettings.sessionName) bits.push(currentSettings.sessionName);
      if (currentSettings.boardName) bits.push(currentSettings.boardName);
      bits.push(currentEffectiveSid.slice(0, 8));
      el.textContent = bits.join(' · ');
    })();

    function showError(message) {
      setStatus('error', message);
      const container = document.getElementById('terminal-container');
      container.innerHTML = `<div class="error-message">${message}</div>`;
    }

    // Variable pattern highlighting decorator
    class VariableHighlightAddon {
      constructor() {
        this.variablePattern = /<[^<>]+>/g;
      }

      activate(terminal) {
        this.terminal = terminal;
        // Register decoration on render
        terminal.onRender(() => {
          this.highlightVariables();
        });
      }

      dispose() {
        // Cleanup if needed
      }

      highlightVariables() {
        // Note: xterm.js doesn't have native pattern highlighting
        // We use a CSS-based approach with the decoration API
        // For simplicity, we highlight using terminal styling when writing
      }
    }

    // Create a custom write handler that highlights <...> patterns
    function createHighlightedTerminal(term) {
      const originalWrite = term.write.bind(term);
      
      // ANSI codes for highlighting
      const highlightStart = '\x1b[38;5;214m\x1b[1m'; // Orange, bold
      const highlightEnd = '\x1b[0m';
      
      term.writeWithHighlight = function(data) {
        // Highlight <...> patterns in output
        const highlighted = data.replace(/<([^<>]+)>/g, (match) => {
          return `${highlightStart}${match}${highlightEnd}`;
        });
        originalWrite(highlighted);
      };
      
      return term;
    }

    async function initTerminal() {
      // Flow 1: If cwd provided but no sid, create new session.
      // Same-origin only — an embed is handed an existing sid by the board, and
      // creating sessions is the spawner's job, not the terminal's.
      if (cwd && !sid && sameOriginApi) {
        try {
          setStatus('connecting', 'Creating session...');
          const response = await fetch('/api/pty/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cwd, name })
          });

          if (!response.ok) {
            throw new Error('Failed to create session');
          }

          const data = await response.json();
          // Redirect to the returned URL
          window.location.href = data.url;
          return;
        } catch (err) {
          showError(`Failed to create session: ${err.message}`);
          return;
        }
      }

      // Flow 2: If sid provided, get a fresh token and connect
      // Use the effective session ID (which may include session name)
      if (sid || currentEffectiveSid) {
        await startSession(currentEffectiveSid);
        return;
      }

      // Flow 3: Missing required params
      showError('Missing required parameters: sid or cwd');
    }

    // Start or reconnect to a session
    async function startSession(sessionId) {
      try {
        setStatus('connecting', 'Connecting to session...');

        // In relay mode there is no token to fetch and no /api to fetch it from.
        // The relay mints one on the machine that owns the session, which is
        // both the only place that can and the only place it belongs.
        if (TRANSPORT_MODE === 'relay') {
          connectToSession(sessionId, null);
          return;
        }

        // Build request body with optional cwd
        const requestBody = { sid: sessionId };
        if (currentSettings.cwd) {
          requestBody.cwd = currentSettings.cwd;
        }
        
        // Get a fresh token for this session
        const response = await fetch('/api/pty/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          throw new Error('Failed to start session');
        }

        const data = await response.json();
        // Extract fresh token from the returned URL
        const freshParams = new URLSearchParams(data.url.split('?')[1]);
        const freshToken = freshParams.get('token');
        
        if (!freshToken) {
          throw new Error('No token in response');
        }

        connectToSession(sessionId, freshToken);
      } catch (err) {
        showError(`Failed to connect: ${err.message}`);
      }
    }

    // -------------------------------------------------------------------------
    // PTY transport
    //
    // Every exchange with the PTY is already a JSON envelope — {type:'input'} and
    // {type:'resize'} out, {type:'data'|'connected'|'error'} in — so which pipe
    // carries them is an implementation detail rather than part of the protocol.
    //
    // One implementation today: a direct websocket, usable because this page is
    // served BY the terminal server and so is same-origin with it. A second is
    // coming for when this page is served publicly, as a board embed, and cannot
    // open a socket to localhost at all — there the envelopes travel by
    // postMessage to a relay on the developer's machine. Identical envelopes,
    // different pipe.
    //
    // Interface: connect(), send(envelope) -> bool, isOpen(), close().
    // Inbound events arrive through the handlers given to the factory.
    // -------------------------------------------------------------------------
    function createWebSocketTransport(url, handlers) {
      let ws = null;
      return {
        kind: 'websocket',
        connect() {
          ws = new WebSocket(url);
          ws.onopen = () => handlers.onOpen({ revived: false });
          ws.onmessage = (event) => {
            let envelope = null;
            try {
              envelope = JSON.parse(event.data);
            } catch (err) {
              console.error('Error parsing message:', err);
              return;
            }
            handlers.onEnvelope(envelope);
          };
          ws.onclose = (event) => handlers.onClose(event);
          ws.onerror = (error) => handlers.onError(error);
        },
        send(envelope) {
          if (!ws || ws.readyState !== WebSocket.OPEN) return false;
          ws.send(JSON.stringify(envelope));
          return true;
        },
        isOpen() {
          return Boolean(ws) && ws.readyState === WebSocket.OPEN;
        },
        close() {
          if (!ws) return;
          ws.close();
          ws = null;
        },
      };
    }

    /**
     * The other implementation: envelopes by postMessage, to a relay running on
     * the developer's machine.
     *
     * Used when this page is served publicly as a board embed, where opening a
     * socket to localhost is categorically forbidden. The relay is same-origin
     * with the terminal server, so it mints the token and owns the socket; this
     * page never handles either. What it gets instead is a nonce, delivered by
     * postMessage and never through any URL, which authorises the one privileged
     * direction — frames carrying keystrokes.
     *
     * Presents exactly the same interface as the websocket transport, so nothing
     * downstream can tell which one it is talking to.
     */
    function createRelayTransport(sessionId, handlers) {
      // The relay's origin is no longer read from the URL. This page's URL is
      // board content when it is an embed, so an origin named there is chosen
      // by whoever last edited the board — and the relay is the thing holding a
      // socket onto the shell.
      //
      // It does not need naming. The relay must be on loopback; that is the
      // entire reason it exists, since only a page on this machine may reach
      // the PTY. See isLoopbackOrigin at the top of this file.
      var nonce = null;
      var relayWindow = null;
      var relayOrigin = null;
      var open = false;
      var retry = null;
      var attempts = 0;
      var MAX_ATTEMPTS = 20;

      function targets() {
        var out = [];
        (function collect(win, depth) {
          if (depth > 8 || out.length > 200) return;
          if (win !== window) out.push(win);
          var n = 0;
          try { n = win.length; } catch (e) { return; }
          for (var i = 0; i < n; i++) { try { collect(win[i], depth + 1); } catch (e) {} }
        })(function () {
          try { window.top.length; return window.top; } catch (e) { return window.parent; }
        }(), 0);
        return out;
      }

      // Wildcard to ask, allowlist to listen — see onMessage. Posting with an
      // exact target origin to every frame logs a console error for each frame
      // that does not match, and a board with several apps installed buries the
      // real errors under hundreds of them.
      //
      // Note what this path actually carries, because it is not only discovery:
      // `mt-relay:frame` and `mt-relay:close` both go through here and both
      // carry the nonce. They are safe today only because a nonce cannot exist
      // before `ready`, and `ready` is what sets relayWindow — so by the time
      // anything secret is sent, the exact-origin branch above is taken and the
      // wildcard below is unreachable. That is an ordering accident, not a
      // guarantee. If you add a caller here, check which branch it can hit.
      function post(message) {
        if (relayWindow && relayOrigin) {
          try { relayWindow.postMessage(message, relayOrigin); } catch (e) {}
          return;
        }
        // Discovery only below this line. A nonce authorises keystrokes, so it
        // goes to a known relay or nowhere — never to every frame on the page.
        // This was previously true only by accident of ordering, because a
        // nonce cannot exist before the reply that sets relayWindow. Stated
        // outright now, so a future caller cannot quietly break it.
        if (message && message.nonce) return;
        targets().forEach(function (win) {
          try { win.postMessage(message, '*'); } catch (e) {}
        });
      }

      function onMessage(event) {
        if (!isLoopbackOrigin(event.origin)) return;
        var d = event.data;
        if (!d || typeof d !== 'object') return;
        if (d.sid && d.sid !== sessionId) return;

        if (d.type === 'mt-relay:hello') {
          // Relay came up after us; ask again straight away.
          relayWindow = event.source; relayOrigin = event.origin;
          if (!open) requestOpen();
          return;
        }
        if (d.type === 'mt-relay:ready') {
          relayWindow = event.source; relayOrigin = event.origin;
          nonce = d.nonce;
          open = true;
          if (retry) { clearInterval(retry); retry = null; }
          handlers.onOpen({ revived: Boolean(d.revived) });
          return;
        }
        if (d.type === 'mt-relay:frame') {
          handlers.onEnvelope(d.envelope);
          return;
        }
        if (d.type === 'mt-relay:closed') {
          open = false;
          nonce = null;
          handlers.onClose({ reason: d.error || 'relay closed the session' });
          return;
        }
        // The relay is there but will not talk to this origin. A configuration
        // problem, so retrying is pointless — stop and show what to change.
        if (d.type === 'mt-relay:refused') {
          open = false;
          nonce = null;
          if (retry) { clearInterval(retry); retry = null; }
          handlers.onClose({ reason: d.reason, fatal: true });
          return;
        }
      }

      function requestOpen() {
        // cwd and name are hints for one case only: the session is gone (the
        // server restarted) and the person at the machine chooses to recreate
        // it. The relay ignores both otherwise, and never acts on either
        // without a human clicking. They come from this page's URL, which is
        // board content, so they are shown in the approval panel before
        // anything uses them, and the server confines cwd to ALLOWED_ROOT.
        post({
          type: 'mt-relay:open',
          v: 1,
          sid: sessionId,
          embedId: embedId,
          cwd: currentSettings && currentSettings.cwd ? currentSettings.cwd : undefined,
          name: name || undefined,
        });
      }

      return {
        kind: 'relay',
        connect() {
          window.addEventListener('message', onMessage);
          attempts = 0;
          requestOpen();
          attempts++;
          // Retries cover the relay iframe loading after this one. Giving up is a
          // real state: the developer has not installed or activated the relay
          // app, and the embed should say so rather than spin.
          retry = setInterval(function () {
            if (open || attempts >= MAX_ATTEMPTS) {
              clearInterval(retry); retry = null;
              if (!open) handlers.onClose({ reason: 'the terminal relay did not answer' });
              return;
            }
            requestOpen();
            attempts++;
          }, 600);
        },
        send(envelope) {
          if (!open || !nonce) return false;
          post({ type: 'mt-relay:frame', v: 1, sid: sessionId, embedId: embedId, nonce: nonce, envelope: envelope });
          return true;
        },
        isOpen() {
          return open;
        },
        close() {
          // Tell the relay, so it releases the socket. A socket left open keeps
          // the PTY server treating the session as active, so it would never
          // idle out — switching live mode off and on repeatedly would strand
          // one per toggle.
          if (open && nonce) {
            post({ type: 'mt-relay:close', v: 1, sid: sessionId, nonce: nonce });
          }
          open = false;
          nonce = null;
          if (retry) { clearInterval(retry); retry = null; }
          window.removeEventListener('message', onMessage);
        },
      };
    }

    // Track current connection for cleanup
    let currentTransport = null;
    let currentTerm = null;
    let shouldReconnect = true;

    function connectToSession(sessionId, token) {
      setStatus('connecting', 'Connecting...');

      // Clean up existing connection
      if (currentTransport) {
        shouldReconnect = false; // Prevent auto-reconnect during cleanup
        currentTransport.close();
        currentTransport = null;
      }
      if (currentTerm) {
        currentTerm.dispose();
        currentTerm = null;
      }
      shouldReconnect = true;

      // Clear terminal container
      const container = document.getElementById('terminal-container');
      container.innerHTML = '';

      // Initialize terminal
      const term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        fontSize: 14,
        fontFamily: 'Menlo, Monaco, "Courier New", monospace',
        theme: {
          background: '#1e1e1e',
          foreground: '#d4d4d4',
          cursor: '#ffffff',
          cursorAccent: '#1e1e1e',
          selection: 'rgba(255, 255, 255, 0.3)',
          black: '#000000',
          red: '#cd3131',
          green: '#0dbc79',
          yellow: '#e5e510',
          blue: '#2472c8',
          magenta: '#bc3fbc',
          cyan: '#11a8cd',
          white: '#e5e5e5',
          brightBlack: '#666666',
          brightRed: '#f14c4c',
          brightGreen: '#23d18b',
          brightYellow: '#f5f543',
          brightBlue: '#3b8eea',
          brightMagenta: '#d670d6',
          brightCyan: '#29b8db',
          brightWhite: '#ffffff'
        }
      });

      currentTerm = term;

      const fitAddon = new FitAddon();
      term.loadAddon(fitAddon);

      // Enable highlighting
      createHighlightedTerminal(term);

      // Mount terminal
      term.open(container);
      fitAddon.fit();

      // WebSocket connection
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}/pty?sid=${encodeURIComponent(sessionId)}&token=${encodeURIComponent(token)}`;
      
      let transport = null;
      let reconnectAttempts = 0;
      const maxReconnectAttempts = 5;
      const reconnectDelay = 2000;

      /** Handlers are transport-agnostic on purpose: nothing below knows or
       * cares whether an envelope arrived over a socket or a postMessage. */
      const transportHandlers = {
        onOpen(info) {
          // A revived session is a FRESH shell under the same id — the previous
          // one had idled out server-side. Worth saying: a clean prompt where
          // there used to be work looks like lost work, and silence invites
          // that reading.
          if (info && info.revived) {
            setStatus('connected', 'Fresh shell — the previous session had ended');
          } else {
            setStatus('connected', `Connected (${currentSettings.sessionName || 'default'})`);
          }
          reconnectAttempts = 0;
          transport.send({ type: 'resize', cols: term.cols, rows: term.rows });
        },

        onEnvelope(msg) {
          switch (msg.type) {
            case 'connected':
              console.log('Session connected:', sessionId);
              break;

            case 'data':
              // Use highlighted write for output
              term.writeWithHighlight(msg.data);
              // Mark the board copy stale; a screen snapshot is taken when
              // the debounce fires (see the history section above).
              appendHistory();
              break;

            case 'error':
              console.error('Server error:', msg.message);
              setStatus('error', `Error: ${msg.message}`);
              break;

            default:
              console.warn('Unknown message type:', msg.type);
          }
        },

        onClose(info) {
          // A fatal close is a configuration answer, not a dropped connection.
          // Reconnecting would just hide it behind a retry counter.
          if (info && info.fatal) {
            setStatus('error', info.reason || 'Refused');
            console.error('[terminal]', info.reason);
            return;
          }
          if (!shouldReconnect) return;
          setStatus('disconnected', info && info.reason ? info.reason : 'Disconnected');
          if (reconnectAttempts < maxReconnectAttempts) {
            reconnectAttempts++;
            setStatus('connecting', `Reconnecting (${reconnectAttempts}/${maxReconnectAttempts})...`);
            setTimeout(connect, reconnectDelay);
          } else {
            // Not a dead end: the visibility hook above retries whenever this
            // embed is looked at again.
            setStatus('error', 'Connection lost — will retry when this is back in view.');
          }
        },

        onError(error) {
          console.error('Transport error:', error);
        },
      };

      function connect() {
        // Tear the previous transport down first. Each one registers a window
        // message listener in connect() and only removes it in close(), so a
        // reconnect that skipped this left the old listener attached — and the
        // next frame from the relay was then handled once per listener. Typing
        // one character showed it six times, which is the initial connection
        // plus maxReconnectAttempts.
        //
        // It took the approval panel to make this visible. A close used to mean
        // a genuine disconnect and was rare; now every refusal while somebody
        // decides is a close, so the budget is spent in seconds and the leak
        // compounds before anyone has clicked anything.
        if (currentTransport) {
          try { currentTransport.close(); } catch (e) {}
        }
        transport =
          TRANSPORT_MODE === 'relay'
            ? createRelayTransport(sessionId, transportHandlers)
            : createWebSocketTransport(wsUrl, transportHandlers);
        currentTransport = transport;
        transport.connect();
      }

      // Coming back into view is a better reason to retry than a spent counter.
      //
      // Miro and Chrome throttle or reset offscreen app iframes, so an embed
      // scrolled away from can burn its whole retry budget while nobody is
      // looking and then sit there dead, telling someone to refresh a board
      // they are already looking at. Visibility is the signal that actually
      // correlates with somebody caring, so it resets the budget and tries
      // again. The PTY survives on the server and replays its scrollback, so a
      // reconnect costs nothing and returns a correct screen.
      if (!window.__miroTerminalVisibilityHook) {
        window.__miroTerminalVisibilityHook = true;
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState !== 'visible') return;
          if (!currentTransport || currentTransport.isOpen()) return;
          reconnectAttempts = 0;
          setStatus('connecting', 'Reconnecting…');
          try { currentTransport.close(); } catch (e) {}
          connect();
        });
      }

      // Start connection
      connect();

      // Variable expansion - expand locally using board info from URL params
      let inputBuffer = '';

      /**
       * Fetch full context (connected docs + viewport) from the terminal server.
       * The Miro app panel pushes context there because postMessage can't
       * cross between sibling Miro iframes (embed ↔ panel).
       * When viewport is missing we signal "context requested" so the Miro app
       * can push; we retry once after a short delay to pick it up.
       */
      // -----------------------------------------------------------------------
      // Terminal history, written onto the board
      //
      // This is what a collaborator sees in the embed: they have no server of
      // their own, so without this the embed can only say "runs elsewhere".
      //
      // Lives in the embed widget's own metadata rather than in a visible item,
      // for three reasons: it is invisible so there is nothing to lay out or
      // hide behind the embed, it is deleted automatically with the terminal it
      // belongs to, and it does not land in every collaborator's undo stack the
      // way editing item content does.
      //
      // Deliberately NOT the scrollback. Metadata caps at roughly 6 KB per item
      // per app, and SCROLLBACK_BYTES is 200 KB — the backend keeps the real
      // buffer and replays it on connect. This is a readout: the last N lines,
      // ANSI stripped, so it stays legible as text. A snapshot of a redrawing
      // TUI is noise, and trying to preserve one would mean storing escape
      // codes we have no room for.
      // -----------------------------------------------------------------------
      const HISTORY_METADATA_KEY = 'miro-terminal-history';
      const HISTORY_MAX_LINES = 50;
      const HISTORY_MAX_BYTES = 5000;   // under the ~6 KB cap, with room for the envelope
      const HISTORY_DEBOUNCE_MS = 4000; // output arrives per keystroke; writes must not

      let historyTimer = null;
      let historyDirty = false;

      /**
       * Takes the last N lines of what is actually ON SCREEN, from xterm's own
       * buffer.
       *
       * The first attempt at this stripped ANSI codes out of the raw PTY stream
       * and tried to rebuild the text itself. That produces plausible-looking
       * nonsense: a terminal positions content with cursor-movement escapes, so
       * once those are stripped the remainder concatenates in STREAM order
       * rather than SCREEN order. Prompts, completions and redraws all land in
       * the wrong place, which is exactly what it looked like — history that
       * was populated, timestamped and wrong.
       *
       * xterm has already done this work. buffer.active holds the rendered
       * grid, with escapes, carriage returns and overwrites resolved, and
       * translateToString gives a line back as plain text. Reading the screen is
       * both simpler and correct by construction.
       */
      function snapshotScreen() {
        const buf = term.buffer.active;
        const total = buf.length;                   // scrollback plus viewport
        const from = Math.max(0, total - HISTORY_MAX_LINES);
        const lines = [];
        for (let i = from; i < total; i++) {
          const line = buf.getLine(i);
          lines.push(line ? line.translateToString(true) : '');
        }
        // Trailing blanks are just the unused rows below the cursor.
        while (lines.length && !lines[lines.length - 1].trim()) lines.pop();

        let text = lines.join('\n');
        // Trim from the front to fit the metadata budget.
        while (new TextEncoder().encode(text).length > HISTORY_MAX_BYTES) {
          const cut = text.indexOf('\n');
          if (cut === -1) { text = text.slice(-HISTORY_MAX_BYTES); break; }
          text = text.slice(cut + 1);
        }
        return text;
      }

      /** Output arrived; the screen is now newer than what the board holds. The
       * snapshot itself is taken at flush time, not here — there is no point
       * rendering a screen we are about to overwrite. */
      function appendHistory() {
        historyDirty = true;
        scheduleHistoryWrite();
      }

      function scheduleHistoryWrite() {
        if (historyTimer) return;
        historyTimer = setTimeout(function () {
          historyTimer = null;
          flushHistory();
        }, HISTORY_DEBOUNCE_MS);
      }

      async function flushHistory() {
        if (!historyDirty) return;
        historyDirty = false;
        try {
          // The app iframe stamps attribution (it has identity scope and a
          // connected SDK) and does the actual setMetadata.
          await askBridge(
            {
              type: 'mt:history-write',
              history: {
                lines: snapshotScreen(),
                sessionName: name || null,   // `name` = the ?name= URL param
                updatedAt: new Date().toISOString(),
                by: null,
              },
            },
            'mt:history-ok'
          );
        } catch (e) {
          // Expected when there is no app iframe listening — a plain board
          // embed in the solo local-dev flow has nothing to write through.
          console.warn('[history] not written:', e.message);
        }
      }

      // Last chance to persist what is on screen, and to release the relay's
      // socket, when this page goes away.
      window.addEventListener('pagehide', function () {
        flushHistory();
        if (currentTransport) {
          try { currentTransport.close(); } catch (e) {}
        }
      });

      // -----------------------------------------------------------------------
      // Talking to the board
      //
      // This page is served BY the terminal server, so it is on a different
      // origin from the Miro app. It loads miro.js and window.miro.board even
      // exists — but the SDK never completes its connection handshake from a
      // foreign origin ("SDK is not connected / SDK version fetching timeout"),
      // so every board call throws. Measured, not assumed.
      //
      // So board work is delegated to the app's headless iframe, which IS on
      // the app origin, over postMessage. That is not a workaround for this
      // situation, it is the permanent shape: once the app is publicly hosted,
      // no single surface can hold both a working SDK and access to localhost.
      // Board work belongs on the app origin; PTY work belongs on this machine.
      // -----------------------------------------------------------------------
      // Which origin counts as "the app" depends on who wrote this page's URL,
      // and that is exactly what SERVED_LOCALLY tells us.
      //
      // Published copy, i.e. an embed: the URL is board content. A board editor
      // who named their own origin here was answered with the terminal's
      // history, and got to supply the values substituted into commands — both
      // demonstrated against a running terminal, neither theorised. So the URL
      // is ignored outright. Nothing is lost: the app and the wrapper framing
      // this page are published to the same origin, so our own origin is the
      // answer anyway.
      //
      // Modal, served from loopback by the terminal server: the URL was built
      // locally by the app itself and cannot be board content, because a board
      // embed cannot load loopback at all. There the parameter is trustworthy,
      // and it is also necessary — the app is on a different origin from this
      // page, and nothing else here knows which.
      const BRIDGE_TIMEOUT_MS = 4000;
      const DEV_APP_ORIGINS = [
        'http://localhost:5173',
        'https://localhost:5173',
        'http://localhost:4173'
      ];
      function appOrigins() {
        const list = [window.location.origin];
        if (SERVED_LOCALLY) {
          (params.get('appOrigins') || '').split(',')
            .map(function (o) { return o.trim(); })
            .filter(Boolean)
            .forEach(function (o) { if (list.indexOf(o) === -1) list.push(o); });
        }
        DEV_APP_ORIGINS.forEach(function (o) { if (list.indexOf(o) === -1) list.push(o); });
        return list;
      }

      let bridgeWindow = null;
      let bridgeOrigin = null;

      function bridgeTargets() {
        const out = [];
        (function collect(win, depth) {
          if (depth > 8 || out.length > 200) return;
          if (win !== window) out.push(win);
          let n = 0;
          try { n = win.length; } catch (e) { return; }
          for (let i = 0; i < n; i++) { try { collect(win[i], depth + 1); } catch (e) {} }
        })(function () {
          try { window.top.length; return window.top; } catch (e) { return window.parent; }
        }(), 0);
        return out;
      }

      /** Sends a request to the app iframe and resolves with the first matching
       * reply. Latches onto whichever frame answers, so later calls stop
       * broadcasting at every frame on the page. */
      function askBridge(request, replyType) {
        const APP_ORIGINS = appOrigins();
        return new Promise(function (resolve, reject) {
          const timer = setTimeout(function () {
            window.removeEventListener('message', onMessage);
            reject(new Error('no answer from the app iframe'));
          }, BRIDGE_TIMEOUT_MS);

          function onMessage(event) {
            if (APP_ORIGINS.indexOf(event.origin) === -1) return;
            const d = event.data;
            if (!d || d.type !== replyType || d.embedId !== embedId) return;
            bridgeWindow = event.source;
            bridgeOrigin = event.origin;
            clearTimeout(timer);
            window.removeEventListener('message', onMessage);
            resolve(d);
          }
          window.addEventListener('message', onMessage);

          const payload = Object.assign({ v: 1, embedId: embedId }, request);
          if (bridgeWindow && bridgeOrigin) {
            try { bridgeWindow.postMessage(payload, bridgeOrigin); } catch (e) {}
          } else {
            bridgeTargets().forEach(function (win) {
              APP_ORIGINS.forEach(function (origin) {
                try { win.postMessage(payload, origin); } catch (e) {}
              });
            });
          }
        });
      }

      async function requestContext() {
        if (!embedId) {
          console.warn('No embedId – cannot fetch context');
          return { input: '', named: {}, viewport: null };
        }

        // Preferred path: ask the app iframe, which can read the board. Falls
        // through to the HTTP relay below when nothing answers — which is the
        // case when this page is a plain board embed in the solo local-dev
        // flow, with no app iframe listening.
        try {
          const ctx = await askBridge({ type: 'mt:ctx-request' }, 'mt:ctx');
          const result = { input: ctx.input || '', named: ctx.named || {}, viewport: ctx.viewport || null };
          lastContextFetch = { at: new Date().toISOString(), ...result, via: 'app-iframe' };
          console.log('[context] via app iframe: input=', result.input.length, 'char(s), named=', Object.keys(result.named));
          return result;
        } catch (e) {
          console.warn('[context] app iframe did not answer:', e.message);
        }

        // The HTTP fallback below only exists for the solo local-dev flow, where
        // this page is served by the terminal server and no app iframe is
        // listening. Served publicly there is no same-origin API to call, and
        // reaching the server's would be a public-to-loopback request — the one
        // thing that is categorically blocked.
        if (!sameOriginApi) {
          return { input: '', named: {}, viewport: null };
        }

        // Signal that this embed needs context; Miro app polls and will push.
        try {
          await fetch(`/api/context/${encodeURIComponent(embedId)}/request`, { method: 'POST' });
        } catch (e) {
          console.warn('Context request signal failed:', e);
        }

        let res = await fetch(`/api/context/${encodeURIComponent(embedId)}`);
        if (!res.ok) {
          throw new Error(`Failed to fetch context: ${res.status}`);
        }

        let data = await res.json();
        let input = data.input || '';
        let named = data.named || {};
        let viewport = data.viewport || null;

        // If viewport not yet pushed, give Miro app time to respond then retry once.
        if (!viewport) {
          await new Promise(r => setTimeout(r, 1500));
          res = await fetch(`/api/context/${encodeURIComponent(embedId)}`);
          if (res.ok) {
            data = await res.json();
            input = data.input || '';
            named = data.named || {};
            viewport = data.viewport || null;
          }
        }

        lastContextFetch = { at: new Date().toISOString(), input, named, viewport, via: 'http-relay' };
        console.log('Fetched context: embedId=', embedId, 'input=', input.length, 'char(s), named=', Object.keys(named), 'viewport=', viewport ? 'yes' : 'no');
        return { input, named, viewport };
      }

      // Browser console debug: run __terminalInputDebug() to inspect [INPUT]/[LABEL] context
      window.__terminalInputDebug = function() {
        console.group('[Terminal iframe] 🔍 context debug');
        console.log('embedId (from URL):', embedId || '(missing – check embed URL)');
        console.log('Last context fetch:', lastContextFetch.at);
        console.log('Last input:', lastContextFetch.input);
        console.log('Last named tokens:', lastContextFetch.named);
        console.log('Full URL:', window.location.href);
        console.groupEnd();
      };
      window.__terminalInputDebugFetch = async function() {
        console.log('[Terminal iframe] Fetching context now...');
        const result = await requestContext();
        console.log('Result:', result);
        return result;
      };

      /**
       * Expand variables in input using current settings
       * Supported variables:
       * - <current_board> → full Miro board URL
       * - <board_id> → just the board ID
       * - <board_name> → board title
       * - <viewport> → current viewport JSON (async fetch)
       * - <selected_items> → (not available in embed, returns placeholder)
       * - [INPUT] → text of unlabelled connected items, joined (async fetch)
       * - [LABEL] → a specific connected item, addressed by its connector's
       *   own caption (double-click the connector line to caption it); a
       *   caption starting with "link" (e.g. [LINK_1]) resolves to that
       *   item's board link instead of its content (async fetch, same
       *   context fetch as [INPUT]).
       */
      const NAMED_TOKEN_PATTERN = /\[([A-Za-z][A-Za-z0-9_]*)\]/g;

      /** Replace only [LABEL] tokens we actually have a value for — leaves any
       * other bracketed text (glob patterns, array indices, ...) untouched.
       * Re-scans its own output, since a substituted value can itself contain
       * another token (e.g. a prompt sticky that says "...write it to
       * [LINK_OUTPUT]") — a single `.replace()` pass never finds that, since
       * it only matches against the original string. Capped so a token whose
       * own value contains itself can't loop forever. */
      /** A substituted value is board content: anyone with edit access to the
       * board wrote it. Carriage returns and newlines in it are not text, they
       * are Enter — [INPUT] alone joins connected items with a newline, so two
       * connected stickies were enough to run the second one as its own
       * command. Other control characters can reposition the cursor, which is
       * how you make what is on screen disagree with what is on the line.
       *
       * Collapsed to spaces rather than dropped, so a two-sticky [INPUT] still
       * reads as two words instead of one run-together one. This does NOT make
       * a value shell-safe, and is not trying to: quoting is the operator's
       * business. It makes the value one line, so that the line the operator is
       * shown is the line that will run. */
      function sanitiseSubstitution(value) {
        return String(value == null ? '' : value).replace(/[\u0000-\u001f\u007f]/g, ' ');
      }

      const MAX_NAMED_TOKEN_PASSES = 5;
      function expandNamedTokens(input, named) {
        if (!named) return input;
        let output = input;
        for (let pass = 0; pass < MAX_NAMED_TOKEN_PASSES; pass++) {
          let changed = false;
          output = output.replace(NAMED_TOKEN_PATTERN, (match, label) => {
            if (!Object.prototype.hasOwnProperty.call(named, label)) return match;
            changed = true;
            return named[label];
          });
          if (!changed) break;
        }
        return output;
      }
      function expandSyncVariables(input) {
        let output = input;
        
        // Use current settings for board info
        const { boardUrl, boardId, boardName } = currentSettings;
        
        // Replace <current_board> with full Miro board URL (brackets = shell-safe)
        output = output.replace(/<current_board>/g, boardUrl || '[no-board-url]');
        
        // Replace <board_id> with just the board ID
        output = output.replace(/<board_id>/g, boardId || '[no-board-id]');
        
        // Replace <board_name> with board name
        output = output.replace(/<board_name>/g, boardName || '[no-board-name]');
        
        // Replace <selected_items> - not available in embed context
        output = output.replace(/<selected_items>/g, '[selection-not-available]');
        
        if (output !== input) {
          console.log('Sync variable expansion:', { input, output });
        }
        
        return output;
      }

      /**
       * Sync expansion plus safe placeholders for async vars. Use when we must not
       * send raw <viewport> or [INPUT]/[LABEL] to the shell (e.g. fallback on error).
       */
      function expandSyncVariablesSafe(input) {
        let output = expandSyncVariables(input);
        output = output.replace(/<viewport>/gi, '[no-viewport]');
        output = output.replace(/\[INPUT\]/g, '[no-connected-docs]');
        return output;
      }

      /**
       * Expand all variables including async ones like <viewport> and [INPUT]/[LABEL]
       * Returns a promise that resolves with the fully expanded string
       */
      async function expandVariables(input) {
        const hasNamedTokens = input.search(NAMED_TOKEN_PATTERN) !== -1;
        const needsContext = /<viewport>/i.test(input) || hasNamedTokens;
        let output = expandSyncVariables(input);

        if (needsContext) {
          try {
            const { input: connectedText, named, viewport } = await requestContext();

            if (/<viewport>/i.test(output)) {
              const viewportStr = viewport && typeof viewport === 'object'
                ? JSON.stringify({ x: viewport.x, y: viewport.y, width: viewport.width, height: viewport.height })
                : '[no-viewport]';
              output = output.replace(/<viewport>/gi, viewportStr);
            }
            // INPUT is a built-in token (the unlabelled-items blob); an explicit
            // connector caption literally named "INPUT" takes priority over it.
            const lookup = { INPUT: sanitiseSubstitution(connectedText) || '[no-connected-docs]' };
            Object.keys(named || {}).forEach(function (k) {
              lookup[k] = sanitiseSubstitution(named[k]);
            });
            output = expandNamedTokens(output, lookup);
          } catch (error) {
            console.error('Failed to fetch context:', error);
            output = output.replace(/\[INPUT\]/g, '[error-fetching-input]');
            output = output.replace(/<viewport>/gi, '[error-fetching-viewport]');
          }
        }

        if (output !== input) {
          console.log('Variable expansion:', { input, output });
        }

        return output;
      }

      // Check if input contains variables: <variable_name> or [LABEL]/[INPUT]
      function containsVariables(input) {
        return /<[a-z_]+>/i.test(input) || input.search(NAMED_TOKEN_PATTERN) !== -1;
      }

      // Check if input contains async variables that need fetching
      function containsAsyncVariables(input) {
        return /<viewport>/i.test(input) || input.search(NAMED_TOKEN_PATTERN) !== -1;
      }

      // Track if we're currently processing an async expansion
      let isProcessingAsync = false;

      /** Set once an expansion has been written to the line and not yet run.
       *
       * Expansion used to end with a carriage return, so board content went
       * straight to the shell and the operator saw the result only after it had
       * run. Typing `echo [INPUT]` was enough: whatever a collaborator had put
       * on a connected sticky executed, unreviewed, on the machine running the
       * terminal.
       *
       * Now expansion writes the real command onto the prompt line and stops.
       * The next Enter submits it verbatim. That turns a sticky into something
       * you are shown before you run, which is the whole of the fix — the value
       * is still not shell-quoted, and quoting is still the operator's job, but
       * it is now a visible risk rather than a silent one. */
      let awaitingConfirm = false;

      // Handle terminal input with variable expansion
      term.onData(async (data) => {
        if (!transport || !transport.isOpen()) {
          return;
        }

        // If we're processing async expansion, queue the input
        if (isProcessingAsync) {
          return;
        }

        // Check if Enter key pressed (carriage return)
        if (data === '\r' || data === '\n') {
          // An expansion is sitting on the line, visible. This Enter is the
          // operator confirming it, so send it as typed and expand nothing:
          // re-expanding would re-read the board and could substitute something
          // other than what is on screen.
          if (awaitingConfirm) {
            awaitingConfirm = false;
            inputBuffer = '';
            transport.send({ type: 'input', data: '\r' });
            return;
          }
          // Check if we need to expand variables
          if (containsVariables(inputBuffer)) {
            // Check if we have async variables that need fetching
            if (containsAsyncVariables(inputBuffer)) {
              isProcessingAsync = true;
              try {
                const expanded = await expandVariables(inputBuffer);

                // Replace the line with the expansion and leave it there.
                transport.send({ type: 'input', data: '\x15' }); // Ctrl+U
                transport.send({ type: 'input', data: expanded });
                inputBuffer = expanded;
                awaitingConfirm = true;
                return;
              } catch (error) {
                console.error('Error expanding variables:', error);
                // Never send raw <...> to shell (causes redirection parse errors).
                // Clear line and send safe expansion (async vars become placeholders).
                const fallback = expandSyncVariablesSafe(inputBuffer);
                transport.send({ type: 'input', data: '\x15' });
                transport.send({ type: 'input', data: fallback });
                inputBuffer = fallback;
                awaitingConfirm = true;
                return;
              } finally {
                isProcessingAsync = false;
              }
            } else {
              // Sync-only variables (safe expand so we never send raw <viewport>/[INPUT] to shell)
              const expanded = expandSyncVariablesSafe(inputBuffer);

              // Replace the line with the expansion and leave it there.
              transport.send({ type: 'input', data: '\x15' }); // Ctrl+U
              transport.send({ type: 'input', data: expanded });
              inputBuffer = expanded;
              awaitingConfirm = true;
              return;
            }
          } else {
            // No variables, just send Enter
            transport.send({ type: 'input', data: '\r' });
          }
          
          // Reset buffer
          inputBuffer = '';
        } else if (data === '\x7f' || data === '\b') {
          // Backspace - remove last character from buffer
          inputBuffer = inputBuffer.slice(0, -1);
          transport.send({ type: 'input', data });
        } else if (data.charCodeAt(0) >= 32 || data === '\t') {
          // Printable character or tab - add to buffer
          inputBuffer += data;
          transport.send({ type: 'input', data });
        } else {
          // Control characters (Ctrl+C, etc.) - send directly, reset buffer.
          // Ctrl+C on a pending expansion abandons it, so stop expecting a
          // confirming Enter.
          inputBuffer = '';
          awaitingConfirm = false;
          transport.send({ type: 'input', data });
        }
      });

      // Handle resize
      const handleResize = () => {
        fitAddon.fit();
        if (transport && transport.isOpen()) {
          transport.send({
            type: 'resize',
            cols: term.cols,
            rows: term.rows
          });
        }
      };

      window.addEventListener('resize', handleResize);

      // Also listen for ResizeObserver for iframe resizing
      const resizeObserver = new ResizeObserver(() => {
        handleResize();
      });
      resizeObserver.observe(container);

      // Focus terminal
      term.focus();
    }

    // Initialize on load
    initTerminal();
  </script>
</body>
</html>
