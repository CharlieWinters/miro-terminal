<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Miro Terminal — relay</title>
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 16px; font-size: 13px; color: #222; }
  h3 { margin: 0 0 6px; font-size: 14px; }
  p { margin: 0 0 10px; font-size: 12px; color: #666; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: #666; font-weight: 600; border-bottom: 1px solid #e0e0e0; padding: 0 6px 4px 0; }
  td { padding: 4px 6px 4px 0; border-bottom: 1px solid #f0f0f0;
       font-family: ui-monospace, Menlo, monospace; }
  .ok { color: #0a7d3d; } .bad { color: #c0392b; }
</style>
</head>
<body>
  <h3>Terminal relay</h3>
  <p>
    Running on your machine. Board embeds cannot reach a local terminal server, so this holds the
    connections on their behalf and forwards bytes both ways.
  </p>
  <p id="origins"></p>
  <table>
    <thead><tr><th>Session</th><th>State</th><th>Live mode</th><th>Frames out</th><th>Frames in</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" style="color:#888">no live sessions</td></tr></tbody>
  </table>

<script>
(function () {
  // ---------------------------------------------------------------------------
  // The relay exists because of one asymmetry: a board embed is a public page
  // and may never reach localhost, while this page is served BY the terminal
  // server and therefore may. So embeds hand their PTY envelopes here and this
  // page puts them on a real websocket.
  //
  // Being same-origin with the server also means it can mint tokens. That is
  // deliberate: the URL token expires, a public page cannot refresh it, and a
  // PTY token has no business on a public page in the first place. Embeds never
  // see one.
  //
  // This page is a Miro app's sdkUri, so its iframe is loaded with the board and
  // stays for the session — which is the whole reason the relay lives here
  // rather than in a panel somebody has to keep open.
  // ---------------------------------------------------------------------------
  // Which origins may ask this relay to open a session.
  //
  // This is the one value that cannot be derived: the relay is served from your
  // machine and has no way to know where you published the embed. So it is set
  // on the relay app's own App URL, which is where you configure the app
  // anyway:
  //
  //   https://localhost:3001/relay.html?embedOrigins=https://you.github.io
  //
  // It matters because opening a session is what yields a nonce, and the nonce
  // is what authorises keystrokes. Leaving it at the localhost default means
  // published embeds simply cannot reach the relay — a closed door rather than
  // an open one, which is the right way round for a default.
  //
  // The sdkUri query parameter does arrive — measured 18 Sep 2026, correcting
  // an earlier note here that guessed it might be a stale frame rather than
  // Miro dropping it. It was a stale frame. That matters because the .env route
  // costs a file edit and a server restart, and an unrestarted server is the
  // single most common way a first run goes wrong.
  //
  // The server is still consulted, so existing .env setups keep working. Once
  // nothing depends on that, /api/relay-config can go: it is an unauthenticated
  // endpoint that exists only to carry this one value.
  var ALLOWED_EMBED_ORIGINS = [
    'http://localhost:5173',
    'https://localhost:5173',
    'http://localhost:4173'
  ];
  (new URLSearchParams(location.search).get('embedOrigins') || '')
    .split(',')
    .map(function (o) { return o.trim().replace(/\/$/, ''); })
    .filter(Boolean)
    .forEach(function (o) {
      if (ALLOWED_EMBED_ORIGINS.indexOf(o) === -1) ALLOWED_EMBED_ORIGINS.push(o);
    });
  var M = {
    open: 'mt-relay:open',
    ready: 'mt-relay:ready',
    frame: 'mt-relay:frame',
    closed: 'mt-relay:closed',
    refused: 'mt-relay:refused',
    close: 'mt-relay:close',
    hello: 'mt-relay:hello'
  };

  // This relay's own identity for this tab.
  //
  // BroadcastChannel is scoped to the ORIGIN, not the tab, and the messages it
  // carries had no relay identity on them. So with two boards open in two
  // tabs (two relay iframes, same origin), a decide or allow-all clicked in
  // tab A's approve.html was also processed by tab B's relay: allow-all
  // approved everything pending in tab B that the person there never saw, and
  // a plain decide … allow called setApproved even when nothing was pending
  // in tab B. Stamping every channel message with this id, and ignoring
  // anything that does not match, scopes the channel back down to one relay.
  //
  // Kept in sessionStorage rather than a closure variable because that is the
  // one thing shared by same-origin iframes within a single tab and NOT
  // across tabs — exactly the scope wanted here, and APPROVAL_KEY below
  // already relies on the same property. Miro reloads this iframe often, so
  // each reload mints a fresh INSTANCE and overwrites the key; that is fine,
  // because approve.html re-reads the key at send time rather than caching it
  // from the page load.
  var INSTANCE = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
  try { sessionStorage.setItem('mt-relay-instance', INSTANCE); } catch (e) {}

  // sid -> { ws, nonce, embedId, out, in, state, source, origin }
  var sessions = {};

  /**
   * Which sessions this machine has agreed to expose to the board, per session.
   *
   * The relay cannot tell one frame on a board page from another — a
   * cross-origin frame has no identity beyond its origin, and every embed
   * shares one, so there is no cryptographic way to bind a request to the
   * widget it claims to come from. Rather than pretend otherwise, the decision
   * is handed to the one party who can actually make it: the person at the
   * machine whose shell it is.
   *
   * Kept in sessionStorage rather than memory because Miro resets offscreen app
   * iframes constantly, and re-asking on every reload would train the answer
   * out of anyone. One decision per session, per browser session; closing the
   * tab forgets it, and Revoke on this page forgets it now.
   */
  var APPROVAL_KEY = 'mt-relay-approved';
  function approvedSids() {
    try { return JSON.parse(sessionStorage.getItem(APPROVAL_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function isApproved(sid) { return approvedSids().indexOf(sid) !== -1; }
  function setApproved(sid, yes) {
    var list = approvedSids().filter(function (x) { return x !== sid; });
    if (yes) list.push(sid);
    try { sessionStorage.setItem(APPROVAL_KEY, JSON.stringify(list)); } catch (e) {}
    render();
  }

  /** Requests waiting on a decision: sid -> { sid, embedId, source, origin }.
   *
   * This was a window.confirm at first, which was wrong twice over. Joining a
   * board with several terminals on it meant a queue of blocking dialogs, one
   * per session, before anything rendered. And confirm() stops the event loop,
   * so the embeds' retries piled up behind it and released in a burst — which
   * is what turned a latent race in openSession into eight sockets on one PTY.
   *
   * A panel instead: it lists every waiting terminal at once, can be answered
   * in any order or all together, and blocks nothing while it is open. */
  var pending = {};
  var denied = {};
  var panelOpenAt = 0;

  function approvalState() {
    return {
      type: 'state',
      relay: INSTANCE,
      pending: Object.keys(pending).map(function (sid) {
        var r = pending[sid];
        return {
          sid: sid, embedId: r.embedId, origin: r.origin,
          // 'missing' means the shell is gone — almost always because the
          // terminal server was restarted, which kills every PTY it owns.
          // Those get Recreate rather than Allow.
          missing: Boolean(r.missing), cwd: r.cwd || null, name: r.name || null
        };
      }),
      approved: approvedSids()
    };
  }

  var channel = null;
  try { channel = new BroadcastChannel('mt-relay-approval'); } catch (e) {}
  function publishState() { if (channel) channel.postMessage(approvalState()); }

  /** Records a request and puts the panel in front of the person at the machine.
   * Re-opening on every retry would fight whatever they are doing, so the panel
   * is only raised once every few seconds; the request itself is always kept. */
  function requestApproval(sid, embedId, source, origin, hints) {
    var known = Object.prototype.hasOwnProperty.call(pending, sid);
    requestApproval.wasKnown = known;
    hints = hints || {};
    pending[sid] = {
      sid: sid, embedId: embedId, source: source, origin: origin,
      cwd: hints.cwd || null, name: hints.name || null, missing: Boolean(hints.missing)
    };
    publishState();
    render();
    var now = Date.now();
    if (!known && now - panelOpenAt > 5000) {
      panelOpenAt = now;
      try {
        if (window.miro && miro.board && miro.board.ui) {
          miro.board.ui.openPanel({ url: 'approve.html' });
        }
      } catch (e) { /* panel refused; the relay page still lists the request */ }
    }
  }

  /** action: 'allow' | 'deny' | 'recreate'.
   *
   * Recreate is the one path that may bring a session into existence, and it
   * exists only here: a board frame can cause a request to be parked, never to
   * be granted. Restarting the terminal server kills every shell it owns, and
   * before this the relay would quietly start a new one under the same id for
   * whoever asked — which is exactly the capability decision 2a removed. This
   * puts it back behind a person, on their own machine, with the directory it
   * will use shown to them first. */
  function decide(sid, action) {
    var req = pending[sid];
    delete pending[sid];

    if (action === 'recreate') {
      if (!req) { publishState(); render(); return; }
      setApproved(sid, true);
      var body = { sid: sid };
      if (req.cwd) body.cwd = req.cwd;
      if (req.name) body.name = req.name;
      fetch('/api/pty/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (res) {
        if (!res.ok) throw new Error('terminal server refused: ' + res.status);
        return openSession(req.sid, req.embedId, req.source, req.origin,
                           { cwd: req.cwd, name: req.name });
      }).catch(function (err) {
        post(req.source, req.origin,
             { type: M.closed, v: 1, embedId: req.embedId, sid: sid, error: err.message });
      });
      publishState();
      render();
      return;
    }

    if (action === 'allow') {
      // Only approve when a request for this sid was actually pending here.
      // Before this check, the branch called setApproved unconditionally, so
      // a decide … allow that reached this relay by mistake (see INSTANCE
      // above — this used to happen across tabs sharing the channel) granted
      // live mode for a session nobody at this machine had been asked about.
      // Now that channel messages are filtered to this relay's own instance
      // first, req should always be set here in practice; this stays as the
      // real guard rather than trusting that filtering alone.
      if (!req) { publishState(); render(); return; }
      setApproved(sid, true);
      // Drive it ourselves rather than waiting to be asked again: the embed
      // gives up retrying long before a person gets round to answering, but
      // its listener stays attached, so a late ready still lands.
      openSession(req.sid, req.embedId, req.source, req.origin,
                  { cwd: req.cwd, name: req.name }).catch(function (err) {
        post(req.source, req.origin,
             { type: M.closed, v: 1, embedId: req.embedId, sid: sid, error: err.message });
      });
    } else {
      denied[sid] = true;
      if (req) {
        post(req.source, req.origin, {
          type: M.closed, v: 1, embedId: req.embedId, sid: sid,
          error: 'the person at this machine declined live mode for this session'
        });
      }
    }
    publishState();
    render();
  }

  if (channel) {
    channel.onmessage = function (e) {
      var d = e.data;
      if (!d || typeof d !== 'object') return;
      // Ignore anything not addressed to this relay instance. Without this,
      // every relay sharing the origin (one per open board tab) processed
      // every approve.html click, regardless of which tab's panel sent it.
      if (d.relay !== INSTANCE) return;
      if (d.type === 'list') { publishState(); return; }
      if (d.type === 'decide') { decide(d.sid, d.action); return; }
      if (d.type === 'allow-all') {
        // Only the ones that need permission. Recreating a shell is never
        // something to do in bulk by accident.
        Object.keys(pending).forEach(function (sid) {
          if (!pending[sid].missing) decide(sid, 'allow');
        });
        return;
      }
      if (d.type === 'revoke') { window.mtRevoke(d.sid); publishState(); return; }
    };
  }

  window.mtRevoke = function (sid) {
    setApproved(sid, false);
    delete pending[sid];
    var s = sessions[sid];
    if (s) {
      s.stale = true;
      try { s.ws.close(); } catch (e) {}
      delete sessions[sid];
    }
    render();
  };

  function render() {
    var tb = document.getElementById('rows');
    // Approved-but-idle sessions are listed too. An empty table has to mean
    // "nothing is exposed", so anything still carrying permission belongs here
    // whether or not a socket happens to be open right now.
    var keys = Object.keys(sessions);
    approvedSids().forEach(function (sid) {
      if (keys.indexOf(sid) === -1) keys.push(sid);
    });
    if (!keys.length) {
      tb.innerHTML = '<tr><td colspan="5" style="color:#888">no live sessions</td></tr>';
      return;
    }
    tb.innerHTML = '';
    keys.forEach(function (sid) {
      var s = sessions[sid] || { state: 'idle', out: 0, inbound: 0 };
      var ok = isApproved(sid);
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + sid.slice(0, 10) + '…</td>' +
        '<td class="' + (s.state === 'open' ? 'ok' : 'bad') + '">' + s.state + '</td>' +
        '<td class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'allowed' : 'not allowed') + '</td>' +
        '<td>' + s.out + '</td><td>' + s.inbound + '</td>';
      if (ok) {
        var td = tr.lastChild;
        var btn = document.createElement('button');
        btn.textContent = 'Revoke';
        btn.onclick = function () { window.mtRevoke(sid); };
        td.appendChild(document.createTextNode(' '));
        td.appendChild(btn);
      }
      tb.appendChild(tr);
    });
  }

  function post(source, origin, message) {
    try {
      source.postMessage(message, origin);
    } catch (e) {
      /* frame went away — expected, embeds get reloaded constantly */
    }
  }

  /**
   * Opens (or reopens) a session for an embed.
   *
   * Always mints a fresh token and a fresh socket rather than reusing one. Embeds
   * are reloaded constantly — Miro and Chrome both reset offscreen app iframes —
   * so "reconnect from scratch" is the normal path, not the exceptional one. The
   * PTY survives on the server and replays its scrollback on connect, so a
   * reconnecting embed gets a correct screen rather than a partial one.
   */
  async function openSession(sid, embedId, source, origin, hints) {
    hints = hints || {};
    // Nothing below this line is reached for a session the person at this
    // machine has not agreed to. An undecided request is parked and surfaced in
    // the approval panel; when it is answered, decide() calls back in here.
    if (!isApproved(sid)) {
      if (denied[sid]) {
        throw new Error('the person at this machine declined live mode for this session');
      }
      requestApproval(sid, embedId, source, origin, hints);
      // Say it once. Every reply here is a close as far as the embed is
      // concerned, and a close costs it a reconnect, so repeating this on each
      // retry burned its whole budget while the person was still reading the
      // panel. Silence just leaves its own retry timer running.
      if (requestApproval.wasKnown) return;
      throw new Error('waiting for permission on the host\'s screen');
    }

    var existing = sessions[sid];

    // Already up for this same embed frame: re-announce and stop.
    //
    // The embed retries `open` until it sees `ready`, and a retry that crosses
    // paths with the reply used to tear down a working socket and build
    // another. Every new socket replays the PTY's scrollback and every live
    // socket echoes input, so two of them meant the prompt appearing twice and
    // each keystroke arriving twice. Re-sending the nonce is both cheaper and
    // idempotent.
    if (existing && existing.state === 'open' && existing.source === source) {
      post(source, origin, {
        type: M.ready, v: 1, embedId: embedId, sid: sid, nonce: existing.nonce, revived: false
      });
      return;
    }

    // An open is already in flight for this frame; let it finish.
    if (existing && existing.state === 'connecting' && existing.source === source) {
      return;
    }

    // Superseding a different frame's connection — the embed was reloaded, or
    // live mode was switched off and on. Mark it stale BEFORE closing: close()
    // only requests a close, and until it completes the old socket keeps
    // delivering messages whose handlers would go on forwarding to the embed.
    if (existing) {
      existing.stale = true;
      if (existing.ws) {
        try { existing.ws.close(); } catch (e) {}
      }
    }

    // Attach, never create. This used to call /api/pty/start, which creates a
    // session for whatever id it is given — so asking for an id nobody had ever
    // seen produced a new shell rather than an error, and the caller chose its
    // working directory too. The attach endpoint refuses an unknown id, so the
    // sessions reachable from the board are exactly those already started here.
    //
    // cwd is no longer forwarded, and is no longer meaningful: nothing is being
    // created, so there is nothing to set a directory on.
    // Claim the slot BEFORE the first await, not after the socket exists.
    //
    // The three guards above read sessions[sid], and this entry used to be
    // assigned only once the socket had been built — so every `open` that
    // arrived while the fetch below was in flight saw nothing, passed all three
    // guards, and opened a socket of its own. The embed retries `open` until it
    // sees `ready`, so that window was hit routinely: sockets accumulated
    // against one PTY, every one of them replaying scrollback and echoing input.
    //
    // The approval prompt made it far worse. confirm() blocks the event loop,
    // so a burst of retries piles up behind it and releases together the moment
    // the dialog is dismissed. Reserving synchronously is what closes the
    // window: the next caller in that burst sees state 'connecting' for its own
    // source and returns.
    var entry = {
      ws: null, nonce: null, embedId: embedId, out: 0, inbound: 0,
      state: 'connecting', source: source, origin: origin
    };
    sessions[sid] = entry;
    render();

    var session;
    try {
      var res = await fetch('/api/pty/' + encodeURIComponent(sid) + '/attach', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      if (res.status === 404) {
        // The shell is gone, which in practice means the terminal server was
        // restarted: PTYs are child processes of it and the session map is in
        // memory, so nothing survives. The relay will not quietly start a new
        // one — that is the capability decision 2a removed — so this becomes a
        // request the person at the machine can answer with Recreate.
        if (sessions[sid] === entry) { delete sessions[sid]; }
        requestApproval(sid, embedId, source, origin, {
          cwd: hints.cwd, name: hints.name, missing: true
        });
        throw new Error('this session no longer exists — recreate it from the relay panel');
      }
      if (!res.ok) throw new Error('terminal server refused: ' + res.status);
      session = await res.json();
    } catch (err) {
      // Give the reservation back, or a failed attach would block every later
      // attempt behind a 'connecting' entry that will never resolve.
      if (sessions[sid] === entry) { delete sessions[sid]; render(); }
      throw err;
    }

    // Superseded while the fetch was in flight.
    if (entry.stale || sessions[sid] !== entry) return;

    // The session was already running; that is now the only case there is.
    var existed = true;

    // A nonce, not the token, is what the embed gets — and it is handed over by
    // postMessage rather than through any URL, so it never touches board
    // content. Re-issued on every open, since embeds reload.
    var nonce = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
    var ws = new WebSocket(session.wsUrl);
    entry.nonce = nonce;
    entry.ws = ws;
    render();

    ws.onopen = function () {
      if (entry.stale || sessions[sid] !== entry) return;
      entry.state = 'open';
      render();
      post(source, origin, {
        type: M.ready, v: 1, embedId: embedId, sid: sid, nonce: nonce, revived: !existed
      });
    };
    ws.onmessage = function (event) {
      // A superseded socket must not forward. This is the check that stops
      // duplicate output: without it, both the old and new sockets deliver
      // every frame to the same embed.
      if (entry.stale || sessions[sid] !== entry) return;
      var envelope = null;
      try { envelope = JSON.parse(event.data); } catch (e) { return; }
      entry.inbound++;
      if (entry.inbound % 25 === 0) render();
      post(source, origin, { type: M.frame, v: 1, embedId: embedId, sid: sid, envelope: envelope });
    };
    ws.onclose = function () {
      // A stale socket closing is the expected end of a supersede, not a
      // disconnection the embed should hear about — telling it would make it
      // reconnect and start the cycle again.
      if (entry.stale || sessions[sid] !== entry) return;
      entry.state = 'closed';
      render();
      post(source, origin, { type: M.closed, v: 1, embedId: embedId, sid: sid });
    };
    ws.onerror = function () {
      if (entry.stale || sessions[sid] !== entry) return;
      entry.state = 'error';
      render();
    };
  }

  window.addEventListener('message', function (event) {
    var d = event.data;
    if (!d || typeof d !== 'object') return;
    if (d.type !== M.open && d.type !== M.frame && d.type !== M.hello && d.type !== M.close) return;
    // No carve-out for an opaque origin. This used to let "null" straight
    // through on the belief that a real embed is sandboxed and arrives that
    // way. Measured on 18 Sep 2026: Miro renders the embed iframe with
    // allow-same-origin, so a genuine embed reports the origin it is served
    // from and matches the list below like anything else. The carve-out was
    // therefore not serving any legitimate caller, while letting any page that
    // sandboxes itself skip the check entirely — which is free to do.
    if (ALLOWED_EMBED_ORIGINS.indexOf(event.origin) === -1) {
      console.warn('[relay] ignoring message from', event.origin);
      // Say so, rather than going quiet. An unlisted origin is far and away the
      // most likely first-run mistake, and silence makes it indistinguishable
      // from the relay app not being installed at all — two problems with
      // completely different fixes. The refusal names the origin and the
      // setting, and leaks nothing: the sender already knows its own origin and
      // that something declined to talk to it.
      try {
        event.source.postMessage({
          type: M.refused,
          v: 1,
          sid: d.sid,
          embedId: d.embedId,
          origin: event.origin,
          accepting: ALLOWED_EMBED_ORIGINS,
          reason: 'The terminal relay does not accept embeds from ' + event.origin +
                  '. Add ?embedOrigins=' + event.origin +
                  " to the relay app's App URL, or set EMBED_ORIGINS=" + event.origin +
                  ' in backend/.env and restart the terminal server.'
        }, event.origin);
      } catch (e) {
        /* nothing more to try */
      }
      return;
    }

    if (d.type === M.hello) {
      post(event.source, event.origin, { type: M.hello, v: 1, relayOrigin: location.origin });
      return;
    }

    // The embed is going away — live mode switched off, or the page unloading.
    // Without this the socket stays open, and because the PTY server counts a
    // connected client as activity, the session would never idle out.
    if (d.type === M.close) {
      var closing = sessions[d.sid];
      if (closing && closing.nonce === d.nonce) {
        closing.stale = true;
        try { closing.ws.close(); } catch (e) {}
        delete sessions[d.sid];
        render();
      }
      return;
    }

    if (d.type === M.open) {
      if (!d.sid) return;
      // Exact target origin, never a wildcard. The reply to an `open` carries
      // the nonce that authorises keystrokes, and the only reason it was ever
      // wildcarded was to reach a caller whose origin read as "null".
      // d.cwd and d.name are hints, carried only so that a session whose shell
      // has died can be recreated in the directory it was created in. Nothing
      // acts on either without a person clicking Recreate, and the panel shows
      // the directory first, because both come from board content.
      openSession(d.sid, d.embedId || '', event.source, event.origin,
                  { cwd: d.cwd, name: d.name })
        .catch(function (err) {
          post(event.source, event.origin,
               { type: M.closed, v: 1, embedId: d.embedId, sid: d.sid, error: err.message });
        });
      return;
    }

    // A frame on its way to the shell. This is the privileged direction — it is
    // keystrokes — so it is gated on the nonce this relay issued for this
    // session, which the embed can only have received by postMessage.
    var entry = sessions[d.sid];
    if (!entry || !entry.ws || entry.stale) return;
    if (!d.nonce || d.nonce !== entry.nonce) {
      console.warn('[relay] refusing a frame with a bad nonce for', d.sid);
      return;
    }
    if (entry.ws.readyState !== WebSocket.OPEN) return;
    entry.ws.send(JSON.stringify(d.envelope));
    entry.out++;
    if (entry.out % 25 === 0) render();
  });

  // Announce to every frame on the page, so an embed that loaded before this
  // iframe did stops waiting. Embeds also retry, which is the path that has to
  // work. (This used to say an exact target origin can never match a sandboxed
  // embed's "null". Measured false: embeds are not opaque-origin here.)
  function announce() {
    var targets = [];
    (function collect(win, depth) {
      if (depth > 8 || targets.length > 200) return;
      if (win !== window) targets.push(win);
      var n = 0;
      try { n = win.length; } catch (e) { return; }
      for (var i = 0; i < n; i++) { try { collect(win[i], depth + 1); } catch (e) {} }
    })(function () {
      try { window.top.length; return window.top; } catch (e) { return window.parent; }
    }(), 0);
    // Wildcard, for the same reason as everywhere else in this system: an exact
    // target origin logs an error per non-matching frame. This announcement
    // carries nothing but a type and this relay's own origin, and every inbound
    // message is still origin-checked before anything happens.
    targets.forEach(function (win) {
      try { win.postMessage({ type: M.hello, v: 1, relayOrigin: location.origin }, '*'); } catch (e) {}
    });
  }

  // Stated on screen because a relay that is running but does not trust your
  // embed's origin looks identical to one that is not running at all.
  function showOrigins() {
    var el = document.getElementById('origins');
    if (!el) return;
    var published = ALLOWED_EMBED_ORIGINS.filter(function (o) {
      return o.indexOf('localhost') === -1;
    });
    el.textContent = published.length
      ? 'Accepting embeds from: ' + ALLOWED_EMBED_ORIGINS.join(', ')
      : 'No published embed origin configured — add ?embedOrigins=https://you.github.io '
        + 'to this app\'s App URL, or set EMBED_ORIGINS in backend/.env ' +
        'and restart the server, or live terminals cannot connect.';
    el.className = published.length ? '' : 'bad';
  }

  // Config first, then start listening. Same-origin, so this is a millisecond,
  // and embeds retry for several seconds — there is no race worth the
  // complexity of queueing messages against one.
  fetch('/api/relay-config')
    .then(function (res) { return res.ok ? res.json() : { embedOrigins: [] }; })
    .catch(function () { return { embedOrigins: [] }; })
    .then(function (cfg) {
      (cfg.embedOrigins || []).forEach(function (o) {
        if (ALLOWED_EMBED_ORIGINS.indexOf(o) === -1) ALLOWED_EMBED_ORIGINS.push(o);
      });
      showOrigins();
      announce();
      console.log('[relay] listening at', location.origin,
                  '· accepting embeds from', ALLOWED_EMBED_ORIGINS.join(', '));
    });

  // The toolbar icon opens the SPAWNER, not this page.
  //
  // This is the developer's app, so its icon should do the developer's job:
  // create terminals. The spawner is served from this same origin, so its calls
  // to /api/browse and /api/pty/start are same-origin — which is the whole
  // reason it lives on this side of the line.
  //
  // Clicking it also serves as activation: a second app's headless iframe is
  // only reliably loaded on a cold board once the user has opened the app at
  // least once. Relay status stays reachable at relay.html, linked from the
  // spawner.
  if (window.miro && window.miro.board) {
    miro.board.ui.on('icon:click', function () {
      return miro.board.ui.openPanel({ url: 'spawner.html' });
    }).catch(function (e) { console.warn('[relay] icon handler:', e); });
  }
})();
</script>
</body>
</html>
