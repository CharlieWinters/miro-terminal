<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  <title>Miro Terminal</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 16px; }
    h3 { margin: 0 0 4px; font-size: 14px; }
    p { margin: 0 0 12px; font-size: 12px; color: #555; }
    label { display: block; font-size: 12px; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 6px 8px; }
    button { width: 100%; padding: 8px; cursor: pointer; }
    hr { margin: 16px 0; border: none; border-top: 1px solid #e0e0e0; }
    .backend-actions { display: flex; gap: 8px; margin-bottom: 8px; }
    .backend-actions button { margin-bottom: 0; }
    .btn-secondary { background: none; }
    #backend-status { font-size: 12px; color: #555; margin: 0; }
    #backend-status.ok { color: #0a7d3d; }
    #backend-status.error { color: #c0392b; }
    .cwd-row { display: flex; gap: 8px; }
    .cwd-row input { flex: 1; margin-bottom: 0; }
    .cwd-row button { width: auto; white-space: nowrap; margin-bottom: 0; }
    .cwd-browser { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin: 8px 0 12px; }
    .cwd-breadcrumb { font-size: 11px; color: #555; margin-bottom: 6px; word-break: break-all; font-family: monospace; }
    .cwd-entries { display: flex; flex-direction: column; gap: 1px; max-height: 180px; overflow-y: auto; margin-bottom: 8px; }
    .cwd-entry { padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .cwd-entry:hover { background: #f0f0f0; }
    .cwd-entry.empty { color: #888; cursor: default; font-size: 12px; }
    .cwd-entry.empty:hover { background: none; }
    .cwd-browser-actions { display: flex; gap: 8px; }
    .cwd-browser-actions button { margin-bottom: 0; }
  </style>
</head>
<body>
  <section id="backend-settings-section">
    <h3>Backend</h3>
    <p>URL of the terminal-server running on <strong>your</strong> machine. Stored only in this browser — every collaborator sets their own.</p>
    <label for="backend-url">Backend URL</label>
    <input type="text" id="backend-url" placeholder="https://localhost:3001" />
    <div class="backend-actions">
      <button type="button" id="save-backend-btn">Save</button>
      <button type="button" id="clear-backend-btn" class="btn-secondary">Clear</button>
    </div>
    <p id="backend-status"></p>
  </section>

  <hr />

  <h3>Terminal options</h3>
  <p>Optional: set a session name and start folder for the new terminal.</p>
  <label for="terminal-opt-name">Session name</label>
  <input type="text" id="terminal-opt-name" placeholder="e.g. frontend, backend" />
  <label for="terminal-opt-cwd">Working directory</label>
  <div class="cwd-row">
    <input type="text" id="terminal-opt-cwd" placeholder="e.g. /app, ~/project" />
    <button type="button" id="browse-cwd-btn" class="btn-secondary">Browse…</button>
  </div>
  <div id="cwd-browser" class="cwd-browser" hidden>
    <div id="cwd-breadcrumb" class="cwd-breadcrumb"></div>
    <div id="cwd-entries" class="cwd-entries"></div>
    <div class="cwd-browser-actions">
      <button type="button" id="cwd-use-btn">Use this folder</button>
      <button type="button" id="cwd-cancel-btn" class="btn-secondary">Cancel</button>
    </div>
  </div>
  <button type="button" id="create-terminal-btn">Create terminal</button>
  <script type="module" src="/src/panel.ts"></script>
</body>
</html>
