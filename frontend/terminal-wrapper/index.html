<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miro Terminal</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1419; --card: #1a2332; --text: #e6edf3; --muted: #8b9cb3;
      --accent: #3b8eea; --border: #2d3a4d; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #root { height: 100%; display: flex; flex-direction: column; }
    #content { flex: 1; min-height: 0; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 1rem;
               padding: 1.5rem; overflow: auto; }
    .card {
      max-width: 30rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem 1.35rem; line-height: 1.55;
    }
    .card h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.65rem; }
    .card p { margin: 0 0 0.75rem; font-size: 0.9rem; color: var(--muted); }
    .card p:last-child { margin-bottom: 0; }
    .card code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em;
      background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 4px;
    }
    .spinner {
      width: 1.75rem; height: 1.75rem; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; margin-right: .45rem; }
    .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
    /* No blanket `button` rule. There used to be one, sized for the full-width
       button inside the card — and when that button was replaced by the bar
       controls, its `width: 100%; margin-top: 1rem` stayed behind and stretched
       both of them across the bar. The bar controls style themselves fully
       below instead of inheriting a shape meant for something else. */
    .err { color: var(--bad); font-size: .85rem; margin-top: .6rem; }
    .meta { font-size: .78rem; color: #5c6b80; margin-top: .9rem; }
    /* History readout. Deliberately a plain <pre>, not an xterm: what is stored
       is ANSI-stripped text (see terminal.html), so rendering it as a terminal
       would imply a fidelity it does not have. */
    #history-wrap { display: none; width: 100%; max-width: 46rem; }
    #history-wrap.visible { display: block; }
    #history-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 1rem; margin-bottom: .4rem; font-size: .78rem; color: var(--muted);
    }
    #history {
      /* contain stops a scroll that reaches the end of this box from chaining
         outward; the wheel handler in script is what stops Miro treating the
         event as a zoom. Both are needed — one governs the scroll, the other
         the event. */
      overscroll-behavior: contain;
      margin: 0; padding: .8rem .9rem; max-height: 18rem; overflow: auto;
      background: #0b1016; border: 1px solid var(--border); border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .78rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
      color: #c9d6e3;
    }
    /* The bar shows as soon as going live is POSSIBLE, not once it is on —
       otherwise the only way to reach the switch would be to already have
       flipped it. It then stays visible while live, so that if keystrokes are
       crossing a public page the person typing can see the thing saying so and
       turn it off without hunting. */
    #livebar { display: none; align-items: center; gap: .6rem; padding: .4rem .6rem;
               background: #111820; border-bottom: 1px solid var(--border); font-size: .75rem;
               color: var(--muted); flex: 0 0 auto; }
    #root.can-live #livebar, #root.live #livebar { display: flex; }
    #livebar .grow { flex: 1 1 auto; min-width: 0; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; }
    /* Two modes, one control. The embed either shows what the terminal did or
       IS the terminal; those are the only two things it can be, so a toggle
       says it better than a checkbox called "Live" did. Full screen is an
       action rather than a third mode, so it sits apart. */
    .seg { display: inline-flex; flex: 0 0 auto; border: 1px solid var(--border);
           border-radius: 6px; overflow: hidden; }
    .seg button { font: inherit; font-size: .72rem; font-weight: 600; line-height: 1.4;
                  width: auto; margin: 0; padding: .22rem .6rem; border-radius: 0;
                  background: transparent; color: var(--muted); border: 0; cursor: pointer;
                  white-space: nowrap; }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button:hover:not(.on) { color: var(--text); }
    .seg button.on { background: var(--accent); color: #fff; }
    .seg button.on.livemode { background: var(--ok); }
    .seg button:disabled { opacity: .4; cursor: default; }
    .iconbtn { font: inherit; font-size: .72rem; line-height: 1.4; width: auto; margin: 0;
               flex: 0 0 auto; padding: .22rem .55rem; cursor: pointer; white-space: nowrap;
               background: transparent; color: var(--muted); border: 1px solid var(--border);
               border-radius: 6px; }
    .iconbtn:hover { color: var(--text); border-color: var(--accent); }
    .iconbtn:disabled { opacity: .4; cursor: default; }
    /* Once there IS history, that is what the embed is for — so the message
       collapses to one line and the output gets the rest of the space. The full
       wording stays available as the strip's tooltip rather than being deleted. */
    #strip { display: none; align-items: center; gap: .5rem; flex: 0 0 auto;
             padding: .5rem .7rem; font-size: .78rem; color: var(--muted);
             background: #131a22; border-bottom: 1px solid var(--border); }
    #root.compact #strip { display: flex; }
    /* The toggle bar already sits at the top and already says which mode this
       is, so a second status bar under it is just stacked chrome. When both
       would appear, the status goes into the toggle bar instead. */
    #root.can-live.compact #strip { display: none; }
    #root.compact #content { padding: 0; gap: 0; justify-content: flex-start; }
    #root.compact .card { display: none; }
    #root.compact #history-wrap { flex: 1; min-height: 0; max-width: none; width: 100%;
                                  display: flex; flex-direction: column; }
    #root.compact #history-head { padding: .45rem .7rem .3rem; margin: 0; }
    #root.compact #history { flex: 1; max-height: none; border: 0; border-radius: 0;
                             background: transparent; }
    #strip .grow { flex: 1; }
    #termframe { display: none; flex: 1; width: 100%; border: 0; min-height: 0; }
    #root.live #termframe { display: block; }
    #root.live #content { display: none; }
  </style>
</head>
<body>
  <div id="root">
    <div id="livebar">
      <span class="seg">
        <button type="button" id="mode-history">History</button>
        <button type="button" id="mode-live" class="livemode">Live</button>
      </span>
      <span class="grow" id="live-note"></span>
      <button type="button" id="fullscreen-btn" class="iconbtn" title="Open the terminal full screen">⤢ Full screen</button>
    </div>
    <iframe id="termframe" title="Terminal" allow="clipboard-read; clipboard-write"></iframe>
    <div id="content">
    <div id="strip">
      <span class="dot" id="strip-dot"></span>
      <strong id="strip-title"></strong>
      <span class="grow"></span>
      <span id="strip-meta"></span>
    </div>
    <div class="card" id="card">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">Looking for the Miro Terminal app…</h1>
      <p id="body">Checking whether this browser is running the terminal for this session.</p>
      <p class="err" id="err" hidden></p>
      <p class="meta" id="meta" hidden></p>
    </div>
    <div id="history-wrap">
      <div id="history-head">
        <span id="history-label">Last output</span>
        <span id="history-when"></span>
      </div>
      <pre id="history"></pre>
    </div>
    </div>
  </div>

  <script>
(function () {
  // ---------------------------------------------------------------------------
  // This page is public (GitHub Pages) and is loaded by EVERY board viewer, so
  // it cannot itself discover whether the person looking at it is the developer
  // running the terminal. It used to try: navigate a nested iframe at
  // localhost, wait 4 seconds for a ready ping, assume the worst on timeout.
  // Chrome's Local Network Access ended that — it gates every request from a
  // public origin to a loopback address, iframe navigation included, and a
  // nested cross-origin iframe can never be granted the permission.
  //
  // So this page asks instead of guessing. The app's headless iframe is served
  // from localhost, so it CAN reach the terminal server, and it answers over
  // postMessage — which is not a network request and so is not gated.
  //
  // There is no window reference to that frame, but none is needed: `length`
  // and indexed access are on the cross-origin property allowlist, so we walk
  // the frame tree from window.top and post to each frame. Verified live.
  //
  // Note there is no timeout-as-verdict any more. An answer arrives or it does
  // not, and "it does not" is a real state (nobody on this board is running the
  // app) rather than a guess about which of several failures occurred.
  // ---------------------------------------------------------------------------
  var params = new URLSearchParams(window.location.search);
  var embedId = params.get('embedId') || '';
  var sessionName = params.get('name') || '';
  // Exact origins only, never '*' — a wildcard would hand this message to every
  // other frame on the board, including other apps' iframes.
  //
  // location.origin is the load-bearing one and needs no configuring: the app
  // and this wrapper are published to the SAME origin, so wherever this page
  // came from is where the app is too. That makes a fork work untouched, and
  // the localhost entries cover a dev server.
  //
  // The URL's appOrigins used to be merged in on top of these. It is now
  // ignored. This page's URL is board content, so that parameter let anyone
  // with edit access nominate their own origin as the app — and be answered
  // with the terminal's history. Demonstrated against a running terminal, not
  // theorised. Nothing legitimate needed it: the app has always been at this
  // page's own origin.
  //
  // The exception is hosting the app and this wrapper on unrelated origins via
  // VITE_WRAPPER_URL. That now needs the app's origin added to this list at
  // build time rather than passed per embed. Deliberate: a build input is not
  // something a board editor can rewrite.
  var appOrigins = [
    window.location.origin,
    'http://localhost:5173',
    'https://localhost:5173',
    'http://localhost:4173'
  ];

  var MSG = {
    hello: 'mt:hello', state: 'mt:state', openDev: 'mt:open-dev',
    opened: 'mt:opened', error: 'mt:error', appReady: 'mt:app-ready',
    historyChanged: 'mt:history-changed'
  };
  var MAX_ATTEMPTS = 6;
  var RETRY_MS = 700;

  var spinner = document.getElementById('spinner');
  var title = document.getElementById('title');
  var body = document.getElementById('body');
  var errEl = document.getElementById('err');
  var metaEl = document.getElementById('meta');

  function render(opts) {
    spinner.hidden = true;
    rootEl.classList.remove('compact');
    title.innerHTML = (opts.dot ? '<span class="dot ' + opts.dot + '"></span>' : '') + opts.title;
    body.innerHTML = opts.body;
    if (opts.meta) { metaEl.hidden = false; metaEl.textContent = opts.meta; }
  }

  /**
   * Shows the stored readout. This is board data, not a live feed: it survives
   * the terminal being stopped and the machine being shut, which is exactly why
   * it lives on the board rather than being streamed.
   *
   * Note it can only appear for a viewer whose browser has an app iframe to
   * read the board through. While sdkUri is on localhost that means the
   * developer only; once the app is hosted publicly, every viewer who installs
   * it gets this too, which is the point of the move.
   */
  function renderHistory(history) {
    if (!history || !history.lines) return;
    var wrap = document.getElementById('history-wrap');
    document.getElementById('history').textContent = history.lines;
    var label = 'Last output';
    if (history.sessionName) label += ' — ' + history.sessionName;
    if (history.by) label += ' · ' + history.by;
    document.getElementById('history-label').textContent = label;
    if (history.updatedAt) {
      var when = new Date(history.updatedAt);
      document.getElementById('history-when').textContent =
        isNaN(when.getTime()) ? '' : when.toLocaleString();
    }
    wrap.classList.add('visible');
    document.getElementById('root').classList.add('with-history');
  }

  // -------------------------------------------------------------------------
  // Live mode: this embed becomes a real interactive terminal.
  //
  // The terminal UI is loaded from THIS origin (it is published next to this
  // page), so nothing here reaches localhost. It talks to a relay running on
  // the developer's machine, over postMessage, and the relay owns the socket
  // and the token.
  //
  // The preference is per-browser rather than per-board on purpose. Turning it
  // on is a statement about what YOUR browser should try, and only a browser
  // with the relay app running can get anywhere — so a collaborator flipping it
  // simply sees it fail to connect, rather than changing anything for anyone
  // else. It is also one less board write.
  // -------------------------------------------------------------------------
  var LIVE_KEY = 'miro-terminal:live:' + embedId;
  var liveWanted = false;
  try { liveWanted = localStorage.getItem(LIVE_KEY) === '1'; } catch (e) {}

  var rootEl = document.getElementById('root');
  var frameEl = document.getElementById('termframe');
  var histBtn = document.getElementById('mode-history');
  var liveBtn = document.getElementById('mode-live');
  var fullBtn = document.getElementById('fullscreen-btn');
  var noteEl = document.getElementById('live-note');
  var lastState = null;

  function terminalUrl(state) {
    var url = new URL('terminal.html', window.location.href);
    url.searchParams.set('transport', 'relay');
    url.searchParams.set('sid', params.get('sid') || '');
    url.searchParams.set('embedId', embedId);
    if (sessionName) url.searchParams.set('name', sessionName);
    if (params.get('boardId')) url.searchParams.set('boardId', params.get('boardId'));
    if (params.get('boardName')) url.searchParams.set('boardName', params.get('boardName'));
    // Neither appOrigins nor relayOrigins is passed any more. The terminal
    // derives both: the app is at its own origin, and the relay is whichever
    // loopback origin answers. Passing them achieved nothing except to put two
    // security-relevant allowlists into a URL that is board content.
    return url.toString();
  }

  function applyLive(state) {
    // Both Live and Full screen need a terminal server; a viewer has neither,
    // so they get history and no controls rather than controls that cannot work.
    var canGoLive = Boolean(state && state.terminalBase);
    rootEl.classList.toggle('can-live', canGoLive);
    liveBtn.disabled = !canGoLive;
    fullBtn.disabled = !canGoLive;

    var live = liveWanted && canGoLive;
    histBtn.classList.toggle('on', !live);
    liveBtn.classList.toggle('on', live);
    noteEl.textContent = live ? (sessionName || '') : '';

    if (!live) {
      rootEl.classList.remove('live');
      if (frameEl.src) frameEl.removeAttribute('src');
      return;
    }
    rootEl.classList.add('live');
    var next = terminalUrl(state);
    // Only reload when the URL actually changes; a refresh of state should not
    // restart a working terminal.
    if (frameEl.src !== next) frameEl.src = next;
  }

  function setMode(wantLive) {
    liveWanted = wantLive;
    try { localStorage.setItem(LIVE_KEY, wantLive ? '1' : '0'); } catch (e) {}
    applyLive(lastState);
  }

  histBtn.addEventListener('click', function () { setMode(false); });
  liveBtn.addEventListener('click', function () { setMode(true); });

  /**
   * One line instead of a card, used whenever there is history to show.
   *
   * The embed exists to show what the terminal did; a paragraph explaining the
   * situation is worth reading once and then only takes room away from the
   * thing being read. The long wording is kept as the tooltip rather than
   * thrown away.
   */
  function renderCompact(opts) {
    spinner.hidden = true;
    rootEl.classList.add('compact');
    var dot = document.getElementById('strip-dot');
    dot.className = 'dot ' + (opts.dot || '');
    document.getElementById('strip-title').textContent = opts.title;
    document.getElementById('strip-meta').textContent = opts.meta || '';
    document.getElementById('strip').title = opts.detail || '';
    // With the toggle bar showing, the mode is already stated by the toggle —
    // so only the session name goes in the note. Repeating "History" next to a
    // control that says History is just noise.
    if (rootEl.classList.contains('can-live')) {
      noteEl.textContent = opts.meta || '';
      noteEl.title = opts.detail || '';
    }
  }

  /**
   * Scrolling over the history should scroll the history, not zoom the board.
   *
   * Miro treats a wheel event over an embed as a canvas zoom, which is right
   * for a picture and wrong for something with its own scrollback — the live
   * terminal already behaves correctly because xterm consumes the event, and
   * the history view should match rather than being the odd one out.
   *
   * So the event is consumed here and applied to the history box directly.
   * Handled in a non-passive listener because preventDefault is the whole
   * point, and applied manually rather than relying on native scrolling so
   * that the event is consumed even at the top or bottom of the box, where
   * native scrolling would decline it and let Miro zoom instead.
   */
  function captureWheel() {
    var box = document.getElementById('history');
    if (!box) return;
    box.addEventListener(
      'wheel',
      function (event) {
        event.preventDefault();
        event.stopPropagation();
        box.scrollTop += event.deltaY;
      },
      { passive: false }
    );
  }
  captureWheel();

  function showError(msg) {
    errEl.hidden = false;
    errEl.textContent = msg;
  }

  if (!embedId) {
    render({
      dot: 'bad',
      title: 'This embed is missing its id',
      body: 'Create the terminal from the Miro Terminal panel rather than pasting this URL onto a board by hand.'
    });
    return;
  }

  // Opened as its own tab rather than inside a board.
  //
  // Everything this page can say depends on there being an app iframe beside it
  // to ask, and on a board to read — neither exists here. Without this check it
  // would ping an empty frame tree, time out, and then claim the terminal is
  // running on someone else's computer, which is both unhelpful and not the
  // point: the page is simply in the wrong place. Worth answering immediately
  // rather than after several seconds of pointless retrying.
  if (window.parent === window) {
    render({
      dot: 'warn',
      title: 'This page belongs on a Miro board',
      body: 'It is the terminal widget for a session running on someone\'s machine, and on its ' +
            'own it has nothing to show: the command history it displays is read from the ' +
            'board, through the Miro Terminal app, and neither is here.' +
            '<br><br>Open the board this terminal was created on to see it.',
      meta: sessionName ? 'session: ' + sessionName : ''
    });
    return;
  }

  // --- find every frame on the page ------------------------------------------
  var frames = [];
  (function collect(win, depth) {
    if (depth > 8 || frames.length > 200) return;
    if (win !== window) frames.push(win);
    var n = 0;
    try { n = win.length; } catch (e) { return; }
    for (var i = 0; i < n; i++) { try { collect(win[i], depth + 1); } catch (e) {} }
  })(function () {
    try { window.top.length; return window.top; } catch (e) { return window.parent; }
  }(), 0);

  // Once a frame has answered, talk only to that one. Posting to every frame
  // with an exact targetOrigin makes the browser log a console error for each
  // frame whose origin does not match — harmless, but enough of it to bury a
  // real error. The wildcard alternative is worse: it would hand the message to
  // every other frame on the board, including other apps' iframes.
  var appWindow = null;
  var appOrigin = null;

  // Discovery goes out with a wildcard target origin, and every REPLY is
  // checked against the allowlist below.
  //
  // The alternative — posting with an exact target origin to every frame — makes
  // the browser log an error for each frame whose origin does not match, and a
  // board with several apps installed produces hundreds of them, burying
  // anything real. A wildcard never mismatches.
  //
  // It is safe here because of the asymmetry: the outbound message carries
  // nothing secret (a type and this embed's own id, which is already board
  // content), and a hostile frame that receives it cannot do anything with a
  // reply, because replies are rejected unless they come from an allowlisted
  // origin. Ask loudly, listen selectively.
  function post(message) {
    if (appWindow && appOrigin) {
      try { appWindow.postMessage(message, appOrigin); } catch (e) {}
      return;
    }
    frames.forEach(function (win) {
      try { win.postMessage(message, '*'); } catch (e) {}
    });
  }

  // --- the four states -------------------------------------------------------
  var settled = false;

  function applyState(s) {
    settled = true;
    lastState = s;
    renderHistory(s.history);
    applyLive(s);
    startRefresh();

    // The app is here and holds this exact session: this is the developer.
    if (s.backendReachable && s.hasThisSession) {
      render({
        dot: 'ok',
        title: 'Your terminal is running',
        body: 'This session is live on <code>' + s.terminalBase + '</code>. Switch to ' +
              '<strong>Live</strong> above to type into it here on the board, or open it full screen.',
        meta: sessionName ? 'session: ' + sessionName : ''
      });
      return;
    }

    // Somebody with the app but no terminal server of their own — which is most
    // people looking at this board. They are a VIEWER, and the history above is
    // the whole reason they installed anything, so say that rather than telling
    // them they have failed to configure something they never wanted.
    //
    // This has to come before the can't-probe branch below: once the app is
    // served publicly that branch is true for everyone, and it was swallowing
    // this case and announcing a terminal on "null".
    if (!s.backendConfigured) {
      if (s.history) {
        renderCompact({
          dot: 'ok',
          title: 'Runs on another machine',
          meta: sessionName || '',
          detail:
            'This terminal runs on a collaborator\'s computer. The output below is what it ' +
            'last wrote, read from the board — no server of your own needed, and it stays ' +
            'readable when their machine is off. To run terminals of your own, start the ' +
            'terminal server and save its address in the app panel.',
        });
        return;
      }
      render({
        dot: 'warn',
        title: 'Nothing written yet',
        body: 'This terminal runs on a collaborator\'s computer and has not written any ' +
              'history to the board yet. It will appear here once it does.<br><br>To run ' +
              'terminals of your own, start the terminal server and save its address in the ' +
              'app panel.',
        meta: sessionName ? 'session: ' + sessionName : ''
      });
      return;
    }

    // The app cannot see the server at all, because the app is served publicly
    // and a public origin may not reach loopback. That is NOT the same as the
    // server being down, and saying so would be a confident lie — the previous
    // version of this branch reported exactly that. Offer both ways in and let
    // the surfaces that CAN see the server do the reporting.
    if (s.canProbeBackend === false) {
      // With history to show, the same reasoning as the viewer case applies:
      // the output is the point and the toggle already says what mode this is.
      if (s.history) {
        renderCompact({
          dot: 'ok',
          title: 'History',
          meta: sessionName || '',
          detail:
            'This session lives on ' + s.terminalBase + '. Switch to Live to type into it here ' +
            'on the board, or open it full screen. Whether it is actually running is something ' +
            'only those can tell you — this page is public, so it cannot reach your machine.',
        });
        return;
      }
      render({
        dot: 'ok',
        title: 'Your terminal',
        body: 'This session lives on <code>' + s.terminalBase + '</code>. Switch to ' +
              '<strong>Live</strong> above to type into it here on the board, or open it ' +
              'full screen. Whether it is actually running is something only those can tell ' +
              'you — this page is public, so it cannot reach your machine to check.',
        meta: sessionName ? 'session: ' + sessionName : ''
      });
      return;
    }

    // Server is up but does not have this session — almost always a second
    // developer with their own server, looking at someone else's terminal.
    // The old page connected them to nothing and said nothing useful.
    if (s.backendReachable) {
      render({
        dot: 'warn',
        title: 'This session is on another machine',
        body: 'Your terminal server is running, but it does not hold this session — it was started ' +
              'on someone else\'s computer. Create your own terminal from the Miro Terminal panel. ' +
              'You can still open this one full screen, which will start a fresh shell under the same id.',
      });
      return;
    }

    // App installed, backend URL saved, but nothing answering there.
    if (s.backendConfigured) {
      render({
        dot: 'warn',
        title: 'Your terminal server is not responding',
        body: (s.history ? 'The output below is the last thing this terminal wrote, read from the board. ' : '') +
              'The app is looking for <code>' + s.terminalBase + '</code> but nothing answered. ' +
              'Start it with <code>npm start</code> in <code>backend/</code>, then reload the board. ' +
              'It must be served over HTTPS with a trusted certificate — a cert warning cannot be ' +
              'shown inside a board embed, so it fails silently.'
      });
      return;
    }

    // Reaching here means a backend IS configured and reachable but something
    // else is off; the branches above cover every case we can name.
    render({
      dot: 'warn',
      title: 'Terminal unavailable',
      body: 'The app is configured for <code>' + s.terminalBase + '</code> but this session ' +
            'could not be reached. Try the app panel, or create a new terminal.'
    });
  }

  function showNoApp() {
    settled = true;
    // Two distinct offers, deliberately separated. Installing the app alone is
    // enough to READ this terminal's history, because that history lives in the
    // embed's board metadata — but metadata is scoped per item per app, so only
    // an iframe of this app can see it, which is why nothing shows here now.
    // Running a server is a further step, and only needed for a terminal of
    // your own. Conflating the two is what the old copy did, and it told people
    // to start a server to fix a problem starting a server does not fix.
    render({
      dot: 'bad',
      title: 'This terminal runs on someone else\'s computer',
      body: 'A collaborator started this session on their own machine, so there is nothing here ' +
            'for this browser to connect to.' +
            '<br><br><strong>Install the Miro Terminal app</strong> to see this terminal\'s recent ' +
            'command history, read straight from the board — no server of your own needed, and it ' +
            'works even when their machine is off.' +
            '<br><br>To run a terminal of your own as well, start the terminal server on your ' +
            'computer (see the project README).',
      meta: sessionName ? 'session: ' + sessionName : ''
    });
  }

  // --- drive -----------------------------------------------------------------
  window.addEventListener('message', function (event) {
    var d = event.data;
    if (!d || typeof d !== 'object') return;
    if (appOrigins.indexOf(event.origin) === -1) return;

    // Latch on: this frame is the app, so stop broadcasting at the others.
    if (!appWindow && event.source) { appWindow = event.source; appOrigin = event.origin; }

    if (d.type === MSG.appReady && !settled) { post({ type: MSG.hello, v: 1, embedId: embedId }); return; }
    if (d.embedId && d.embedId !== embedId) return;

    // The terminal just wrote new history. Re-ask rather than trusting the
    // nudge to carry it, so there is one code path that renders state.
    if (d.type === MSG.historyChanged) { post({ type: MSG.hello, v: 1, embedId: embedId }); return; }

    if (d.type === MSG.state) { applyState(d); return; }
    if (d.type === MSG.opened) { fullBtn.disabled = false; errEl.hidden = true; return; }
    if (d.type === MSG.error) {
      fullBtn.disabled = false;
      showError(d.error || 'The app could not open the terminal.');
      return;
    }
  });

  // Full screen is the same request as before — the app opens the terminal as a
  // modal on the machine that owns the session. Only the name changed: "open in
  // developer mode" described a world where the modal was the ONLY way to type
  // into a terminal, which stopped being true when Live arrived.
  fullBtn.addEventListener('click', function () {
    fullBtn.disabled = true;
    errEl.hidden = true;
    post({ type: MSG.openDev, v: 1, embedId: embedId });
    // Re-enable even if no answer comes back, so the button is never stuck.
    setTimeout(function () { fullBtn.disabled = false; }, 4000);
  });

  // Safety net behind the history-changed push: covers a nudge arriving while
  // this frame was still loading, or a write made by a different browser
  // entirely. Slow on purpose — the push is what makes it feel live, and this
  // only has to stop the embed going permanently stale. Paused while the tab is
  // hidden, since a board nobody is looking at does not need refreshing.
  var REFRESH_MS = 20000;
  var refreshTimer = null;

  function startRefresh() {
    if (refreshTimer) return;
    refreshTimer = setInterval(function () {
      if (document.visibilityState === 'visible') {
        post({ type: MSG.hello, v: 1, embedId: embedId });
      }
    }, REFRESH_MS);
  }

  var attempts = 0;
  post({ type: MSG.hello, v: 1, embedId: embedId }); attempts++;
  var iv = setInterval(function () {
    if (settled) { clearInterval(iv); return; }
    if (attempts >= MAX_ATTEMPTS) { clearInterval(iv); showNoApp(); return; }
    post({ type: MSG.hello, v: 1, embedId: embedId }); attempts++;
  }, RETRY_MS);
})();
  </script>
</body>
</html>
