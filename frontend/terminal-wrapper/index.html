<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miro Terminal</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1419; --card: #1a2332; --text: #e6edf3; --muted: #8b9cb3;
      --accent: #3b8eea; --border: #2d3a4d; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #root { height: 100%; display: flex; flex-direction: column; }
    #content { flex: 1; min-height: 0; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 1rem;
               padding: 1.5rem; overflow: auto; }
    .card {
      max-width: 30rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem 1.35rem; line-height: 1.55;
    }
    .card h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.65rem; }
    .card p { margin: 0 0 0.75rem; font-size: 0.9rem; color: var(--muted); }
    .card p:last-child { margin-bottom: 0; }
    .card code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em;
      background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 4px;
    }
    .spinner {
      width: 1.75rem; height: 1.75rem; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; margin-right: .45rem; }
    .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
    button {
      font: inherit; font-size: .9rem; font-weight: 600; width: 100%; margin-top: 1rem;
      padding: .6rem 1rem; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: #fff; border: 0;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .55; cursor: default; }
    .err { color: var(--bad); font-size: .85rem; margin-top: .6rem; }
    .meta { font-size: .78rem; color: #5c6b80; margin-top: .9rem; }
    /* History readout. Deliberately a plain <pre>, not an xterm: what is stored
       is ANSI-stripped text (see terminal.html), so rendering it as a terminal
       would imply a fidelity it does not have. */
    #history-wrap { display: none; width: 100%; max-width: 46rem; }
    #history-wrap.visible { display: block; }
    #history-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 1rem; margin-bottom: .4rem; font-size: .78rem; color: var(--muted);
    }
    #history {
      margin: 0; padding: .8rem .9rem; max-height: 18rem; overflow: auto;
      background: #0b1016; border: 1px solid var(--border); border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .78rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
      color: #c9d6e3;
    }
    /* The bar shows as soon as going live is POSSIBLE, not once it is on —
       otherwise the only way to reach the switch would be to already have
       flipped it. It then stays visible while live, so that if keystrokes are
       crossing a public page the person typing can see the thing saying so and
       turn it off without hunting. */
    #livebar { display: none; align-items: center; gap: .6rem; padding: .4rem .6rem;
               background: #111820; border-bottom: 1px solid var(--border); font-size: .75rem;
               color: var(--muted); flex: 0 0 auto; }
    #root.can-live #livebar, #root.live #livebar { display: flex; }
    #livebar .grow { flex: 1; }
    .switch { display: inline-flex; align-items: center; gap: .4rem; cursor: pointer;
              user-select: none; font-weight: 600; color: var(--text); }
    .switch input { margin: 0; }
    .live-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--bad); }
    .live-dot.on { background: var(--ok); }
    #termframe { display: none; flex: 1; width: 100%; border: 0; min-height: 0; }
    #root.live #termframe { display: block; }
    #root.live #content { display: none; }
  </style>
</head>
<body>
  <div id="root">
    <div id="livebar">
      <span class="live-dot" id="live-dot"></span>
      <label class="switch"><input type="checkbox" id="live-toggle" /> Live</label>
      <span class="grow" id="live-note"></span>
    </div>
    <iframe id="termframe" title="Terminal" allow="clipboard-read; clipboard-write"></iframe>
    <div id="content">
    <div class="card" id="card">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">Looking for the Miro Terminal app…</h1>
      <p id="body">Checking whether this browser is running the terminal for this session.</p>
      <button type="button" id="dev-btn" hidden>Open in developer mode</button>
      <p class="err" id="err" hidden></p>
      <p class="meta" id="meta" hidden></p>
    </div>
    <div id="history-wrap">
      <div id="history-head">
        <span id="history-label">Last output</span>
        <span id="history-when"></span>
      </div>
      <pre id="history"></pre>
    </div>
    </div>
  </div>

  <script>
(function () {
  // ---------------------------------------------------------------------------
  // This page is public (GitHub Pages) and is loaded by EVERY board viewer, so
  // it cannot itself discover whether the person looking at it is the developer
  // running the terminal. It used to try: navigate a nested iframe at
  // localhost, wait 4 seconds for a ready ping, assume the worst on timeout.
  // Chrome's Local Network Access ended that — it gates every request from a
  // public origin to a loopback address, iframe navigation included, and a
  // nested cross-origin iframe can never be granted the permission.
  //
  // So this page asks instead of guessing. The app's headless iframe is served
  // from localhost, so it CAN reach the terminal server, and it answers over
  // postMessage — which is not a network request and so is not gated.
  //
  // There is no window reference to that frame, but none is needed: `length`
  // and indexed access are on the cross-origin property allowlist, so we walk
  // the frame tree from window.top and post to each frame. Verified live.
  //
  // Note there is no timeout-as-verdict any more. An answer arrives or it does
  // not, and "it does not" is a real state (nobody on this board is running the
  // app) rather than a guess about which of several failures occurred.
  // ---------------------------------------------------------------------------
  var params = new URLSearchParams(window.location.search);
  var embedId = params.get('embedId') || '';
  var sessionName = params.get('name') || '';
  // Exact origins only, never '*' — a wildcard would hand this message to every
  // other frame on the board, including other apps' iframes.
  //
  // The URL's appOrigins is stamped into each embed AT CREATION TIME and then
  // frozen in board content, so an embed made before the app moved origin still
  // names the old one. Rather than have every existing terminal go dark on the
  // day the app is published, the known origins are always tried as well. The
  // cost of an extra candidate is one ignored postMessage.
  var KNOWN_APP_ORIGINS = [
    'https://charliewinters.github.io',
    'http://localhost:5173',
    'https://localhost:5173',
    'http://localhost:4173'
  ];
  var appOrigins = (params.get('appOrigins') || '')
    .split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  KNOWN_APP_ORIGINS.forEach(function (o) {
    if (appOrigins.indexOf(o) === -1) appOrigins.push(o);
  });

  var MSG = {
    hello: 'mt:hello', state: 'mt:state', openDev: 'mt:open-dev',
    opened: 'mt:opened', error: 'mt:error', appReady: 'mt:app-ready',
    historyChanged: 'mt:history-changed'
  };
  var MAX_ATTEMPTS = 6;
  var RETRY_MS = 700;

  var spinner = document.getElementById('spinner');
  var title = document.getElementById('title');
  var body = document.getElementById('body');
  var devBtn = document.getElementById('dev-btn');
  var errEl = document.getElementById('err');
  var metaEl = document.getElementById('meta');

  function render(opts) {
    spinner.hidden = true;
    title.innerHTML = (opts.dot ? '<span class="dot ' + opts.dot + '"></span>' : '') + opts.title;
    body.innerHTML = opts.body;
    devBtn.hidden = !opts.button;
    if (opts.meta) { metaEl.hidden = false; metaEl.textContent = opts.meta; }
  }

  /**
   * Shows the stored readout. This is board data, not a live feed: it survives
   * the terminal being stopped and the machine being shut, which is exactly why
   * it lives on the board rather than being streamed.
   *
   * Note it can only appear for a viewer whose browser has an app iframe to
   * read the board through. While sdkUri is on localhost that means the
   * developer only; once the app is hosted publicly, every viewer who installs
   * it gets this too, which is the point of the move.
   */
  function renderHistory(history) {
    if (!history || !history.lines) return;
    var wrap = document.getElementById('history-wrap');
    document.getElementById('history').textContent = history.lines;
    var label = 'Last output';
    if (history.sessionName) label += ' — ' + history.sessionName;
    if (history.by) label += ' · ' + history.by;
    document.getElementById('history-label').textContent = label;
    if (history.updatedAt) {
      var when = new Date(history.updatedAt);
      document.getElementById('history-when').textContent =
        isNaN(when.getTime()) ? '' : when.toLocaleString();
    }
    wrap.classList.add('visible');
    document.getElementById('root').classList.add('with-history');
  }

  // -------------------------------------------------------------------------
  // Live mode: this embed becomes a real interactive terminal.
  //
  // The terminal UI is loaded from THIS origin (it is published next to this
  // page), so nothing here reaches localhost. It talks to a relay running on
  // the developer's machine, over postMessage, and the relay owns the socket
  // and the token.
  //
  // The preference is per-browser rather than per-board on purpose. Turning it
  // on is a statement about what YOUR browser should try, and only a browser
  // with the relay app running can get anywhere — so a collaborator flipping it
  // simply sees it fail to connect, rather than changing anything for anyone
  // else. It is also one less board write.
  // -------------------------------------------------------------------------
  var LIVE_KEY = 'miro-terminal:live:' + embedId;
  var liveWanted = false;
  try { liveWanted = localStorage.getItem(LIVE_KEY) === '1'; } catch (e) {}

  var rootEl = document.getElementById('root');
  var frameEl = document.getElementById('termframe');
  var toggleEl = document.getElementById('live-toggle');
  var dotEl = document.getElementById('live-dot');
  var noteEl = document.getElementById('live-note');
  var lastState = null;

  function terminalUrl(state) {
    var url = new URL('terminal.html', window.location.href);
    url.searchParams.set('transport', 'relay');
    url.searchParams.set('sid', params.get('sid') || '');
    url.searchParams.set('embedId', embedId);
    if (sessionName) url.searchParams.set('name', sessionName);
    if (params.get('boardId')) url.searchParams.set('boardId', params.get('boardId'));
    if (params.get('boardName')) url.searchParams.set('boardName', params.get('boardName'));
    url.searchParams.set('appOrigins', appOrigins.join(','));
    // Where to find the relay: it is served BY the terminal server, so the
    // relay's origin is the backend's origin.
    try {
      url.searchParams.set('relayOrigins', new URL(state.terminalBase).origin);
    } catch (e) {}
    return url.toString();
  }

  function applyLive(state) {
    var canGoLive = Boolean(state && state.terminalBase);
    rootEl.classList.toggle('can-live', canGoLive);
    toggleEl.disabled = !canGoLive;
    toggleEl.checked = liveWanted && canGoLive;

    if (!liveWanted || !canGoLive) {
      rootEl.classList.remove('live');
      dotEl.classList.remove('on');
      if (frameEl.src) frameEl.removeAttribute('src');
      return;
    }
    rootEl.classList.add('live');
    dotEl.classList.add('on');
    noteEl.textContent = sessionName || '';
    var next = terminalUrl(state);
    // Only reload when the URL actually changes; a refresh of state should not
    // restart a working terminal.
    if (frameEl.src !== next) frameEl.src = next;
  }

  toggleEl.addEventListener('change', function () {
    liveWanted = toggleEl.checked;
    try { localStorage.setItem(LIVE_KEY, liveWanted ? '1' : '0'); } catch (e) {}
    applyLive(lastState);
  });

  function showError(msg) {
    errEl.hidden = false;
    errEl.textContent = msg;
  }

  if (!embedId) {
    render({
      dot: 'bad',
      title: 'This embed is missing its id',
      body: 'Create the terminal from the Miro Terminal panel rather than pasting this URL onto a board by hand.'
    });
    return;
  }

  // --- find every frame on the page ------------------------------------------
  var frames = [];
  (function collect(win, depth) {
    if (depth > 8 || frames.length > 200) return;
    if (win !== window) frames.push(win);
    var n = 0;
    try { n = win.length; } catch (e) { return; }
    for (var i = 0; i < n; i++) { try { collect(win[i], depth + 1); } catch (e) {} }
  })(function () {
    try { window.top.length; return window.top; } catch (e) { return window.parent; }
  }(), 0);

  // Once a frame has answered, talk only to that one. Posting to every frame
  // with an exact targetOrigin makes the browser log a console error for each
  // frame whose origin does not match — harmless, but enough of it to bury a
  // real error. The wildcard alternative is worse: it would hand the message to
  // every other frame on the board, including other apps' iframes.
  var appWindow = null;
  var appOrigin = null;

  // Discovery goes out with a wildcard target origin, and every REPLY is
  // checked against the allowlist below.
  //
  // The alternative — posting with an exact target origin to every frame — makes
  // the browser log an error for each frame whose origin does not match, and a
  // board with several apps installed produces hundreds of them, burying
  // anything real. A wildcard never mismatches.
  //
  // It is safe here because of the asymmetry: the outbound message carries
  // nothing secret (a type and this embed's own id, which is already board
  // content), and a hostile frame that receives it cannot do anything with a
  // reply, because replies are rejected unless they come from an allowlisted
  // origin. Ask loudly, listen selectively.
  function post(message) {
    if (appWindow && appOrigin) {
      try { appWindow.postMessage(message, appOrigin); } catch (e) {}
      return;
    }
    frames.forEach(function (win) {
      try { win.postMessage(message, '*'); } catch (e) {}
    });
  }

  // --- the four states -------------------------------------------------------
  var settled = false;

  function applyState(s) {
    settled = true;
    lastState = s;
    renderHistory(s.history);
    applyLive(s);
    startRefresh();

    // The app is here and holds this exact session: this is the developer.
    if (s.backendReachable && s.hasThisSession) {
      render({
        dot: 'ok',
        title: 'Your terminal is running',
        body: 'This session is live on <code>' + s.terminalBase + '</code>. Open it in a modal, ' +
              'or flip <strong>Live</strong> above to type into it right here on the board.',
        button: true,
        meta: sessionName ? 'session: ' + sessionName : ''
      });
      return;
    }

    // Server is up but does not have this session — almost always a second
    // developer with their own server, looking at someone else's terminal.
    // The old page connected them to nothing and said nothing useful.
    if (s.backendReachable) {
      render({
        dot: 'warn',
        title: 'This session is on another machine',
        body: 'Your terminal server is running, but it does not hold this session — it was started ' +
              'on someone else\'s computer. Create your own terminal from the Miro Terminal panel. ' +
              'You can still open this one in developer mode, which will start a fresh shell under the same id.',
        button: true
      });
      return;
    }

    // App installed, backend URL saved, but nothing answering there.
    if (s.backendConfigured) {
      render({
        dot: 'warn',
        title: 'Your terminal server is not responding',
        body: (s.history ? 'The output below is the last thing this terminal wrote, read from the board. ' : '') +
              'The app is looking for <code>' + s.terminalBase + '</code> but nothing answered. ' +
              'Start it with <code>npm start</code> in <code>backend/</code>, then reload the board. ' +
              'It must be served over HTTPS with a trusted certificate — a cert warning cannot be ' +
              'shown inside a board embed, so it fails silently.'
      });
      return;
    }

    // App installed, but this browser has never been pointed at a server.
    render({
      dot: 'warn',
      title: 'No terminal server configured',
      body: 'You have the Miro Terminal app, but this browser has no backend URL saved. ' +
            'Open the app panel, enter the address of the terminal server on your machine, and hit Save.'
    });
  }

  function showNoApp() {
    settled = true;
    // Two distinct offers, deliberately separated. Installing the app alone is
    // enough to READ this terminal's history, because that history lives in the
    // embed's board metadata — but metadata is scoped per item per app, so only
    // an iframe of this app can see it, which is why nothing shows here now.
    // Running a server is a further step, and only needed for a terminal of
    // your own. Conflating the two is what the old copy did, and it told people
    // to start a server to fix a problem starting a server does not fix.
    render({
      dot: 'bad',
      title: 'This terminal runs on someone else\'s computer',
      body: 'A collaborator started this session on their own machine, so there is nothing here ' +
            'for this browser to connect to.' +
            '<br><br><strong>Install the Miro Terminal app</strong> to see this terminal\'s recent ' +
            'command history, read straight from the board — no server of your own needed, and it ' +
            'works even when their machine is off.' +
            '<br><br>To run a terminal of your own as well, start the terminal server on your ' +
            'computer (see the project README).',
      meta: sessionName ? 'session: ' + sessionName : ''
    });
  }

  // --- drive -----------------------------------------------------------------
  window.addEventListener('message', function (event) {
    var d = event.data;
    if (!d || typeof d !== 'object') return;
    if (appOrigins.indexOf(event.origin) === -1) return;

    // Latch on: this frame is the app, so stop broadcasting at the others.
    if (!appWindow && event.source) { appWindow = event.source; appOrigin = event.origin; }

    if (d.type === MSG.appReady && !settled) { post({ type: MSG.hello, v: 1, embedId: embedId }); return; }
    if (d.embedId && d.embedId !== embedId) return;

    // The terminal just wrote new history. Re-ask rather than trusting the
    // nudge to carry it, so there is one code path that renders state.
    if (d.type === MSG.historyChanged) { post({ type: MSG.hello, v: 1, embedId: embedId }); return; }

    if (d.type === MSG.state) { applyState(d); return; }
    if (d.type === MSG.opened) { devBtn.disabled = false; errEl.hidden = true; return; }
    if (d.type === MSG.error) {
      devBtn.disabled = false;
      showError(d.error || 'The app could not open the terminal.');
      return;
    }
  });

  devBtn.addEventListener('click', function () {
    devBtn.disabled = true;
    errEl.hidden = true;
    post({ type: MSG.openDev, v: 1, embedId: embedId });
    // Re-enable even if no answer comes back, so the button is never stuck.
    setTimeout(function () { devBtn.disabled = false; }, 4000);
  });

  // Safety net behind the history-changed push: covers a nudge arriving while
  // this frame was still loading, or a write made by a different browser
  // entirely. Slow on purpose — the push is what makes it feel live, and this
  // only has to stop the embed going permanently stale. Paused while the tab is
  // hidden, since a board nobody is looking at does not need refreshing.
  var REFRESH_MS = 20000;
  var refreshTimer = null;

  function startRefresh() {
    if (refreshTimer) return;
    refreshTimer = setInterval(function () {
      if (document.visibilityState === 'visible') {
        post({ type: MSG.hello, v: 1, embedId: embedId });
      }
    }, REFRESH_MS);
  }

  var attempts = 0;
  post({ type: MSG.hello, v: 1, embedId: embedId }); attempts++;
  var iv = setInterval(function () {
    if (settled) { clearInterval(iv); return; }
    if (attempts >= MAX_ATTEMPTS) { clearInterval(iv); showNoApp(); return; }
    post({ type: MSG.hello, v: 1, embedId: embedId }); attempts++;
  }, RETRY_MS);
})();
  </script>
</body>
</html>
