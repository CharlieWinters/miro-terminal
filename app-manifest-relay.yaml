# Manifest for the SECOND app: the relay.
#
# Paste into a NEW Miro app, separate from Miro Terminal, at
# https://miro.com/app/settings/user-profile/apps/
#
# WHY A SECOND APP. A board embed is a public page and may never reach
# localhost — Chrome's Local Network Access forbids it. So something served
# from your own machine has to hold the websockets on the embeds' behalf. An
# app's sdkUri iframe is loaded with the board and stays for the session, which
# makes it the only surface that is both local and always present. A panel would
# do the job but would have to be kept open.
#
# It stores nothing and reads nothing from the board. It only relays bytes,
# which is why it needs no scopes and why keeping it separate costs nothing.
#
# Replace YOUR-USER in the URL below with wherever you published the embed.
# That query parameter is how the relay learns which origins may ask it to open
# a session; it arrives intact, which an earlier note here doubted.
#
# Setting EMBED_ORIGINS in backend/.env still works and is still read, so an
# existing setup needs no change. The App URL is simply the better home: no file
# to edit, and no server restart to forget.
#
# Without EMBED_ORIGINS set, live terminals cannot connect. The relay page says
# so, and the embed shows the reason rather than timing out.

appName: Miro Terminal relay
sdkVersion: SDK_V2

sdkUri: https://localhost:3001/relay.html?embedOrigins=https://YOUR-USER.github.io

# None. It never touches the board.
scopes: []

# Its icon opens the terminal spawner, which is the developer's job and belongs
# with the developer's app. Relay status stays at relay.html, linked from there.
#
# Click the icon once after installing regardless: a second app's headless
# iframe is only reliably loaded on a cold board load after the user has opened
# the app at least once — so without that click, live terminals work only
# sporadically.
